  function buildCard(task){
    const subject = getSubject(task.subjectId);
    const locked = !!task.lockedByAdmin;
    const shared = isSharedTask(task);
    const ownerUid = shared ? task.ownerUid : currentUser;
    const isOwner = ownerUid === currentUser;
    const canManageMeta = !locked && (!shared || isOwner);
    const draggable = !locked && !shared;

    const card = document.createElement("div");
    card.className = "task-card" + (task.done ? " done" : "") + (locked ? " locked" : "") + (shared ? " shared" : "");
    card.style.setProperty("--subject-color", subject.color);
    card.style.setProperty("--subject-bg", subject.color + "22");
    card.draggable = draggable;
    card.dataset.id = task.id;

    if(draggable){
      card.addEventListener("dragstart", e => {
        draggingId = task.id; draggingType = task.type;
        e.dataTransfer.setData("text/plain", task.id);
        e.dataTransfer.effectAllowed = "move";
        setTimeout(() => card.classList.add("dragging"), 0);
      });
      card.addEventListener("dragend", () => { draggingId = null; draggingType = null; renderBoard(); });
    }

    const timeStr = task.type === "gepland" ? task.startTime + (task.endTime ? "–" + task.endTime : "") : null;

    // --- row 1: checkbox, title, chat toggle, kebab ---
    const top = document.createElement("div");
    top.className = "task-top";
    const check = document.createElement("input");
    check.type = "checkbox";
    check.checked = shared ? !!(task.doneByUid && task.doneByUid[currentUser]) : !!task.done;
    check.title = shared ? "Markeer jouw deel als klaar" : "Markeer als klaar";
    check.setAttribute("aria-label","Markeer als klaar");
    top.appendChild(check);

    const titleEl = document.createElement("div");
    titleEl.className = "task-title";
    titleEl.innerHTML = escapeHtml(task.title) + (task.repeatGroupId ? ' <span class="repeat-badge" title="Herhalend">↻</span>' : '');
    if(canManageMeta) titleEl.title = "Klik om te bewerken";
    top.appendChild(titleEl);

    if(shared){
      const chatBtn = document.createElement("button");
      chatBtn.className = "icon-btn chat-toggle-btn" + (expandedChat.has(task.id) ? " active" : "");
      chatBtn.title = "Chat bij deze taak"; chatBtn.textContent = "💬";
      chatBtn.addEventListener("click", () => { toggleSet(expandedChat, task.id); renderBoard(); });
      top.appendChild(chatBtn);
    }

    if(!locked){
      const details = document.createElement("details");
      details.className = "kebab-wrap";
      const summary = document.createElement("summary");
      summary.className = "icon-btn kebab-btn"; summary.textContent = "⋯"; summary.title = "Meer opties";
      details.appendChild(summary);
      const menu = document.createElement("div");
      menu.className = "kebab-menu";

      function menuBtn(label, handler, danger){
        const b = document.createElement("button");
        b.type = "button"; b.textContent = label;
        if(danger) b.className = "danger";
        b.addEventListener("click", () => { details.removeAttribute("open"); handler(); });
        menu.appendChild(b);
      }

      if(!shared){
        menuBtn("Bewerken", () => { editingId = task.id; renderBoard(); });
        menuBtn("Dupliceren", () => {
          const copy = { ...task, id: newId(), done: false, repeatGroupId: null, published: false };
          const tasks = currentTasks();
          const idx = tasks.findIndex(t => t.id === task.id);
          tasks.splice(idx + 1, 0, copy);
          saveApp(); renderBoard();
        });
        menuBtn("Kopieer naar volgende week", () => {
          const copy = { ...task, id: newId(), done: false, repeatGroupId: null, published: false };
          const d = new Date(task.date); d.setDate(d.getDate() + 7);
          copy.date = toISO(d);
          currentTasks().push(copy);
          saveApp(); renderBoard();
        });
        menuBtn("Mensen uitnodigen…", () => { expandedInvite.add(task.id); renderBoard(); });
        menuBtn("Verwijderen", () => {
          const tasks = currentTasks();
          const idx = tasks.findIndex(t => t.id === task.id);
          state.usersData[currentUser].tasks = tasks.filter(t => t.id !== task.id);
          if(task.published) state.published = state.published.filter(p => p.refTaskId !== task.id);
          saveApp(); renderBoard();
          showToast("Taak verwijderd", "Ongedaan maken", () => {
            currentTasks().splice(Math.min(idx, currentTasks().length), 0, task);
            saveApp(); renderBoard();
          });
        }, true);
      } else if(isOwner){
        menuBtn("Bewerken", () => { editingId = task.id; renderBoard(); });
        menuBtn("Mensen uitnodigen…", () => { expandedInvite.add(task.id); renderBoard(); });
        menuBtn("Verwijderen (voor iedereen)", () => {
          if(!confirm("Deze gedeelde taak verwijderen voor alle deelnemers?")) return;
          state.sharedTasks = state.sharedTasks.filter(t => t.id !== task.id);
          state.notifications = state.notifications.filter(n => n.taskId !== task.id);
          if(task.published) state.published = state.published.filter(p => p.refTaskId !== task.id);
          saveApp(); renderBoard();
          showToast("Gedeelde taak verwijderd.");
        }, true);
      } else {
        menuBtn("Verlaten", () => {
          task.participants = (task.participants||[]).filter(u => u !== currentUser);
          saveApp(); renderBoard();
          showToast("Je hebt de gedeelde taak verlaten.");
        }, true);
      }
      details.appendChild(menu);
      top.appendChild(details);
    }

    card.appendChild(top);

    // --- row 2: compact meta ---
    const meta = document.createElement("div");
    meta.className = "task-meta";
    let metaHtml = "";
    if(timeStr) metaHtml += `<span class="pill pill-time">${escapeHtml(timeStr)}</span>`;
    metaHtml += `<span class="pill pill-subject"><span class="subject-dot"></span>${escapeHtml(subject.name)}</span>`;
    if(task.type !== "gepland" && task.priority && task.priority !== "gemiddeld") metaHtml += `<span class="pill pill-prio-${task.priority}">${prioLabel(task.priority)}</span>`;
    if(locked) metaHtml += `<span class="pill pill-locked">🔒 van beheerder</span>`;
    const stCount = (task.subtasks || []).length;
    const stDone = (task.subtasks || []).filter(s => s.done).length;
    if(stCount > 0) metaHtml += `<span class="pill pill-neutral">☑ ${stDone}/${stCount}</span>`;
    meta.innerHTML = metaHtml;

    if(shared){
      const uids = Array.from(new Set([task.ownerUid, ...(task.participants||[])]));
      const doneCount = uids.filter(u => task.doneByUid && task.doneByUid[u]).length;
      const progressPill = document.createElement("span");
      progressPill.className = "pill pill-neutral";
      progressPill.textContent = doneCount + "/" + uids.length + " klaar";
      meta.appendChild(progressPill);
      meta.appendChild(buildAvatarRow(uids, task.doneByUid));
    }

    const stBtn = document.createElement("button");
    stBtn.className = "icon-btn"; stBtn.title = "Subtaken/checklist"; stBtn.textContent = "☑";
    stBtn.addEventListener("click", () => { toggleSet(expandedSubtasks, task.id); renderBoard(); });
    meta.appendChild(stBtn);

    if(canManageMeta){
      const notesBtn = document.createElement("button");
      notesBtn.className = "icon-btn notes-btn" + (task.notes ? " has-notes" : "");
      notesBtn.title = "Notitie"; notesBtn.textContent = "📝";
      notesBtn.addEventListener("click", () => { toggleSet(expandedNotes, task.id); renderBoard(); });
      meta.appendChild(notesBtn);

      const pubBtn = document.createElement("button");
      pubBtn.className = "icon-btn publish-btn" + (task.published ? " active" : "");
      pubBtn.title = task.published ? "Publiceren ongedaan maken" : "Publiceer naar algemene planning";
      pubBtn.textContent = "📢";
      pubBtn.addEventListener("click", () => {
        if(task.published){
          task.published = false;
          state.published = state.published.filter(p => p.refTaskId !== task.id);
          showToast("Publicatie ingetrokken.");
          saveApp(); renderBoard();
          return;
        }
        const deptIds = accountDepartmentIds(accountByUid(ownerUid));
        if(deptIds.length > 1){
          // meerdere afdelingen: laat kiezen welke, in plaats van automatisch overal te publiceren
          expandedPublishPicker.add(task.id);
          renderBoard();
          return;
        }
        task.published = true;
        publishTaskToDepartments(task, ownerUid, deptIds.length ? deptIds : [null]);
        showToast("Gepubliceerd naar de algemene planning.");
        saveApp(); renderBoard();
      });
      meta.appendChild(pubBtn);
    }

    card.appendChild(meta);

    if(task.location){
      const loc = document.createElement("div");
      loc.className = "task-location";
      loc.textContent = "📍 " + task.location;
      card.appendChild(loc);
    }

    if(canManageMeta && expandedNotes.has(task.id)){
      const notesArea = document.createElement("textarea");
      notesArea.className = "notes-area";
      notesArea.placeholder = "Notitie bij deze taak…";
      notesArea.value = task.notes || "";
      notesArea.addEventListener("input", () => { task.notes = notesArea.value; saveApp(); });
      card.appendChild(notesArea);
      setTimeout(() => notesArea.focus(), 0);
    } else if(shared && !isOwner && task.notes){
      const notesView = document.createElement("div");
      notesView.className = "notes-area";
      notesView.style.whiteSpace = "pre-wrap";
      notesView.textContent = task.notes;
      card.appendChild(notesView);
    }

    if(!locked && expandedInvite.has(task.id)){
      card.appendChild(buildInvitePanel(task, shared));
    }

    if(canManageMeta && expandedPublishPicker.has(task.id)){
      card.appendChild(buildPublishPicker(task, ownerUid));
    }

    if(expandedSubtasks.has(task.id)){
      card.appendChild(buildSubtasksPanel(task));
    }

    if(shared && expandedChat.has(task.id)){
      card.appendChild(buildChatPanel(task));
    }

    check.addEventListener("change", e => {
      if(shared){
        task.doneByUid = task.doneByUid || {};
        task.doneByUid[currentUser] = e.target.checked;
        const allUids = Array.from(new Set([task.ownerUid, ...(task.participants||[])]));
        task.done = allUids.length > 0 && allUids.every(u => !!task.doneByUid[u]);
      } else {
        task.done = e.target.checked;
      }
      saveApp(); renderBoard();
    });
    if(canManageMeta){
      titleEl.addEventListener("click", () => { editingId = task.id; renderBoard(); });
    }

    return card;
  }

  function buildAddForm(dateISO, existingTask, opts){
    opts = opts || {};
    const isEdit = !!existingTask;
    const form = document.createElement("form");
    form.className = "add-form";
    let currentType = isEdit ? existingTask.type : "taak";

    const toggle = document.createElement("div");
    toggle.className = "type-toggle";
    const taakLabel = document.createElement("label");
    taakLabel.innerHTML = `<input type="radio" name="type" value="taak"><span>Taak</span>`;
    const geplandLabel = document.createElement("label");
    geplandLabel.innerHTML = `<input type="radio" name="type" value="gepland"><span>Vaste tijd</span>`;
    toggle.appendChild(taakLabel); toggle.appendChild(geplandLabel);
    form.appendChild(toggle);
    toggle.querySelector(`input[value="${currentType}"]`).checked = true;
    (currentType === "taak" ? taakLabel : geplandLabel).classList.add("active");

    const titleInput = document.createElement("input");
    titleInput.type = "text"; titleInput.placeholder = "Wat staat er op de planning?"; titleInput.required = true; titleInput.autocomplete = "off";
    if(isEdit) titleInput.value = existingTask.title;
    form.appendChild(titleInput);

    const timeRow = document.createElement("div");
    timeRow.className = "row";
    timeRow.style.display = currentType === "gepland" ? "flex" : "none";
    const startTime = document.createElement("input"); startTime.type = "time";
    const endTime = document.createElement("input"); endTime.type = "time";
    if(isEdit && existingTask.startTime) startTime.value = existingTask.startTime;
    if(isEdit && existingTask.endTime) endTime.value = existingTask.endTime;
    timeRow.appendChild(startTime); timeRow.appendChild(endTime);
    form.appendChild(timeRow);

    const locationInput = document.createElement("input");
    locationInput.type = "text"; locationInput.placeholder = "Locatie (optioneel)";
    locationInput.style.display = currentType === "gepland" ? "block" : "none";
    if(isEdit && existingTask.location) locationInput.value = existingTask.location;
    form.appendChild(locationInput);

    const row = document.createElement("div");
    row.className = "row";
    const subjectSelect = document.createElement("select");
    state.subjects.forEach(s => { const opt = document.createElement("option"); opt.value = s.id; opt.textContent = s.name; subjectSelect.appendChild(opt); });
    const newOpt = document.createElement("option"); newOpt.value = "__new__"; newOpt.textContent = "+ Nieuw vak…";
    subjectSelect.appendChild(newOpt);
    if(isEdit) subjectSelect.value = existingTask.subjectId;
    row.appendChild(subjectSelect);

    const prioSelect = document.createElement("select");
    [["gemiddeld","Prio: gemiddeld"],["hoog","Prio: hoog"],["laag","Prio: laag"]].forEach(([v,l]) => { const opt = document.createElement("option"); opt.value = v; opt.textContent = l; prioSelect.appendChild(opt); });
    prioSelect.style.display = currentType === "gepland" ? "none" : "block";
    if(isEdit && existingTask.priority) prioSelect.value = existingTask.priority;
    row.appendChild(prioSelect);
    form.appendChild(row);

    const newSubjectInput = document.createElement("input");
    newSubjectInput.type = "text"; newSubjectInput.placeholder = "Naam nieuw vak/categorie"; newSubjectInput.style.display = "none";
    form.appendChild(newSubjectInput);
    subjectSelect.addEventListener("change", () => { newSubjectInput.style.display = subjectSelect.value === "__new__" ? "block" : "none"; });

    let recipientChecks = null;
    if(opts.isAdmin && !isEdit){
      const recipWrap = document.createElement("div");
      recipWrap.style.display = "flex"; recipWrap.style.flexDirection = "column"; recipWrap.style.gap = "3px";
      recipWrap.style.border = "1.5px dashed var(--border)"; recipWrap.style.borderRadius = "6px"; recipWrap.style.padding = "7px";
      const recipTitle = document.createElement("div");
      recipTitle.textContent = "Ontvangers:";
      recipTitle.style.fontSize = "0.74rem"; recipTitle.style.fontWeight = "600"; recipTitle.style.color = "var(--ink-soft)";
      recipWrap.appendChild(recipTitle);
      recipientChecks = [];
      state.accounts.filter(a => a.status === "approved").forEach(a => {
        const lbl = document.createElement("label");
        lbl.className = "invite-row";
        const cb = document.createElement("input");
        cb.type = "checkbox"; cb.value = a.uid;
        cb.checked = a.uid === opts.targetUid;
        lbl.appendChild(cb);
        lbl.appendChild(document.createTextNode(a.username + (a.uid === currentUser ? " (jij)" : "")));
        recipWrap.appendChild(lbl);
        recipientChecks.push(cb);
      });
      form.appendChild(recipWrap);
    }

    toggle.querySelectorAll('input[name="type"]').forEach(radio => {
      radio.addEventListener("change", () => {
        currentType = radio.value;
        taakLabel.classList.toggle("active", currentType === "taak");
        geplandLabel.classList.toggle("active", currentType === "gepland");
        const isGepland = currentType === "gepland";
        timeRow.style.display = isGepland ? "flex" : "none";
        locationInput.style.display = isGepland ? "block" : "none";
        prioSelect.style.display = isGepland ? "none" : "block";
        startTime.required = isGepland;
      });
    });

    let repeatCheckbox, repeatWeeksInput;
    if(!isEdit){
      const repeatRow = document.createElement("div");
      repeatRow.className = "repeat-row";
      repeatCheckbox = document.createElement("input");
      repeatCheckbox.type = "checkbox";
      repeatCheckbox.id = "rep-" + dateISO + "-" + Math.random().toString(36).slice(2,6);
      const repLabel = document.createElement("label");
      repLabel.setAttribute("for", repeatCheckbox.id);
      repLabel.textContent = "Herhaal elke week, ";
      repeatWeeksInput = document.createElement("input");
      repeatWeeksInput.type = "number"; repeatWeeksInput.min = "2"; repeatWeeksInput.max = "20"; repeatWeeksInput.value = "8"; repeatWeeksInput.disabled = true;
      repeatRow.appendChild(repeatCheckbox); repeatRow.appendChild(repLabel); repeatRow.appendChild(repeatWeeksInput);
      repeatRow.appendChild(document.createTextNode(" weken"));
      repeatCheckbox.addEventListener("change", () => { repeatWeeksInput.disabled = !repeatCheckbox.checked; });
      form.appendChild(repeatRow);
    }

    const actions = document.createElement("div");
    actions.className = "actions";
    const saveBtn = document.createElement("button"); saveBtn.type = "submit"; saveBtn.className = "save-btn"; saveBtn.textContent = isEdit ? "Opslaan" : "Toevoegen";
    const cancelBtn = document.createElement("button"); cancelBtn.type = "button"; cancelBtn.className = "cancel-btn"; cancelBtn.textContent = "Annuleren";
    cancelBtn.addEventListener("click", () => {
      if(opts.isAdmin){ if(isEdit) adminEditingId = null; else adminOpenForm = null; renderAdminBoard(); }
      else { if(isEdit) editingId = null; else openForm = null; renderBoard(); }
    });
    actions.appendChild(saveBtn); actions.appendChild(cancelBtn);
    form.appendChild(actions);

    form.addEventListener("submit", e => {
      e.preventDefault();
      const title = titleInput.value.trim();
      if(!title) return;
      if(currentType === "gepland" && !startTime.value){ startTime.focus(); return; }

      let subjectId = subjectSelect.value;
      if(subjectId === "__new__"){
        const name = newSubjectInput.value.trim();
        if(!name) return;
        const id = "s" + Date.now();
        const color = SUBJECT_PALETTE[state.subjects.length % SUBJECT_PALETTE.length];
        state.subjects.push({ id, name, color });
        subjectId = id;
      }

      const fields = {
        title, subjectId, type: currentType,
        priority: currentType === "gepland" ? null : prioSelect.value,
        startTime: currentType === "gepland" ? startTime.value : null,
        endTime: currentType === "gepland" ? (endTime.value || null) : null,
        location: currentType === "gepland" ? (locationInput.value.trim() || null) : null
      };

      if(isEdit){
        Object.assign(existingTask, fields);
        if(opts.isAdmin) adminEditingId = null; else editingId = null;
      } else {
        let recipientUids = [opts.targetUid];
        if(opts.isAdmin && recipientChecks){
          const checked = recipientChecks.filter(cb => cb.checked).map(cb => cb.value);
          recipientUids = checked.length ? checked : [opts.targetUid];
        }
        const targetArrays = opts.isAdmin
          ? recipientUids.map(uid => (ensureUserData(uid), state.usersData[uid].tasks))
          : [currentTasks()];

        targetArrays.forEach(targetArr => {
          if(repeatCheckbox && repeatCheckbox.checked){
            const weeks = Math.max(2, Math.min(20, parseInt(repeatWeeksInput.value, 10) || 8));
            const groupId = "rep" + Date.now() + Math.random().toString(36).slice(2,5);
            const baseDate = new Date(dateISO);
            for(let w = 0; w < weeks; w++){
              const d = new Date(baseDate); d.setDate(baseDate.getDate() + w*7);
              targetArr.push({ id: newId(), date: toISO(d), done: false, repeatGroupId: groupId, lockedByAdmin: !!opts.isAdmin, published: false, notes: "", ...fields });
            }
          } else {
            targetArr.push({ id: newId(), date: dateISO, done: false, repeatGroupId: null, lockedByAdmin: !!opts.isAdmin, published: false, notes: "", ...fields });
          }
        });

        if(opts.isAdmin){
          adminOpenForm = null;
          if(recipientUids.length > 1) showToast("Taak toegevoegd voor " + recipientUids.length + " personen.");
        } else { openForm = null; }
      }
      saveApp();
      (opts.isAdmin ? renderAdminBoard : renderBoard)();
    });

    setTimeout(() => titleInput.focus(), 0);
    return form;
  }

  /* ============ ALGEMENE PLANNING TAB (weekbord, per account gekleurd) ============ */
  function renderGeneralTab(root){
    const myDeptIds = myDepartmentIds();
    // afdeling bepalen: gewone gebruikers zien alleen hun eigen afdeling(en); beheerder kan alles kiezen
    if(!isAdmin()){
      if(genSelectedDept === undefined || genSelectedDept === null || (genSelectedDept !== "__none__" && !myDeptIds.includes(genSelectedDept))){
        genSelectedDept = myDeptIds.length ? myDeptIds[0] : "__none__";
      }
    } else if(genSelectedDept === undefined){
      genSelectedDept = myDeptIds.length ? myDeptIds[0] : "__all__";
    }

    root.innerHTML = `
      <div class="topbar">
        <div class="weeknav" id="genDeptNav"></div>
        <div class="weeknav">
          <button id="genPrevWeek" aria-label="Vorige week">←</button>
          <div class="weekrange" id="genWeekRange"></div>
          <button id="genNextWeek" aria-label="Volgende week">→</button>
          <button id="genTodayBtn" class="today-btn">Deze week</button>
        </div>
      </div>
      <div class="filters" id="genSubjectFilters"></div>
      <div class="gen-legend" id="genLegend"></div>
      <div id="genDayTabs"></div>
      <div class="board" id="genBoard"></div>
      <footer>Alleen gepubliceerde items uit ${isAdmin() ? "de gekozen afdeling" : "jouw afdeling"} zijn hier zichtbaar — je eigen planning blijft privé. ${isAdmin() ? "Als beheerder kun je hier ook items verwijderen." : ""}</footer>
    `;

    const deptNav = document.getElementById("genDeptNav");
    if(isAdmin()){
      const select = document.createElement("select");
      select.className = "field-input admin-user-select"; select.style.minWidth = "170px";
      select.innerHTML = `<option value="__all__">Alle afdelingen</option><option value="__none__">Geen afdeling</option>` +
        state.departments.map(d => `<option value="${d.id}">${escapeHtml(d.name)}</option>`).join("");
      select.value = genSelectedDept;
      select.addEventListener("change", () => {
        genSelectedDept = select.value;
        genFilterUid = null;
        renderGenLegend();
        renderGeneralBoard();
      });
      deptNav.appendChild(select);
    } else if(myDeptIds.length > 1){
      const select = document.createElement("select");
      select.className = "field-input admin-user-select"; select.style.minWidth = "170px";
      select.innerHTML = myDeptIds.map(id => `<option value="${id}">${escapeHtml(departmentName(id))}</option>`).join("");
      select.value = genSelectedDept;
      select.addEventListener("change", () => {
        genSelectedDept = select.value;
        genFilterUid = null;
        renderGenLegend();
        renderGeneralBoard();
      });
      deptNav.appendChild(select);
    } else {
      const label = document.createElement("div");
      label.className = "weekrange";
      label.style.minWidth = "auto";
      label.textContent = "Afdeling: " + departmentName(myDepartmentId());
      deptNav.appendChild(label);
    }

    document.getElementById("genPrevWeek").addEventListener("click", () => { genWeekOffset--; renderGeneralBoard(); });
    document.getElementById("genNextWeek").addEventListener("click", () => { genWeekOffset++; renderGeneralBoard(); });
    document.getElementById("genTodayBtn").addEventListener("click", () => { genWeekOffset = 0; genMobileDayIndex = null; renderGeneralBoard(); });

    renderGenFilters();
    renderGenLegend();
    renderGeneralBoard();
  }

  function accountsInSelectedDept(){
    const approved = state.accounts.filter(a => a.status === "approved");
    if(genSelectedDept === "__all__") return approved;
    if(genSelectedDept === "__none__") return approved.filter(a => accountDepartmentIds(a).length === 0);
    return approved.filter(a => accountDepartmentIds(a).includes(genSelectedDept));
  }

  function renderGenFilters(){
    const box = document.getElementById("genSubjectFilters");
    if(!box) return;
    box.innerHTML = "";
    const allChip = document.createElement("button");
    allChip.className = "chip" + (genFilterSubjectId === null ? " active" : "");
    allChip.textContent = "Alle vakken";
    allChip.addEventListener("click", () => { genFilterSubjectId = null; renderGeneralBoard(); });
    box.appendChild(allChip);
    state.subjects.forEach(s => {
      const chip = document.createElement("button");
      chip.className = "chip" + (genFilterSubjectId === s.id ? " active" : "");
      chip.textContent = s.name;
      chip.style.setProperty("--chip-color", s.color);
      chip.style.setProperty("--chip-bg", s.color + "22");
      chip.addEventListener("click", () => { genFilterSubjectId = genFilterSubjectId === s.id ? null : s.id; renderGeneralBoard(); });
      box.appendChild(chip);
    });
  }

  function renderGenLegend(){
    const legend = document.getElementById("genLegend");
    if(!legend) return;
    legend.innerHTML = "";
    const allChip = document.createElement("button");
    allChip.className = "chip" + (genFilterUid === null ? " active" : "");
    allChip.textContent = "Iedereen";
    allChip.addEventListener("click", () => { genFilterUid = null; renderGenLegend(); renderGeneralBoard(); });
    legend.appendChild(allChip);
    accountsInSelectedDept().forEach(a => {
      const chip = document.createElement("button");
      chip.className = "chip";
      const active = genFilterUid === a.uid;
      chip.style.borderColor = a.color; chip.style.color = active ? "#fff" : a.color;
      chip.style.background = active ? a.color : a.color + "18";
      chip.textContent = a.username;
      chip.addEventListener("click", () => { genFilterUid = genFilterUid === a.uid ? null : a.uid; renderGenLegend(); renderGeneralBoard(); });
      legend.appendChild(chip);
    });
    if(accountsInSelectedDept().length === 0){
      const hint = document.createElement("div");
      hint.className = "empty-hint";
      hint.textContent = "Niemand in deze afdeling.";
      legend.appendChild(hint);
    }
  }

  function buildGenCard(item){
    const subject = getSubject(item.subjectId);
    const ownerColor = accountColor(item.ownerUid);
    const canUnpub = item.ownerUid === currentUser;
    const canAdminDel = isAdmin();
    const timeStr = item.type === "gepland" ? item.startTime + (item.endTime ? "–" + item.endTime : "") : null;

    const card = document.createElement("div");
    card.className = "task-card";
    card.style.setProperty("--subject-color", ownerColor);
    card.style.setProperty("--subject-bg", ownerColor + "22");

    const top = document.createElement("div");
    top.className = "task-top";
    const avatar = document.createElement("span");
    avatar.className = "avatar-chip";
    avatar.style.setProperty("--avatar-color", ownerColor);
    avatar.title = item.ownerUsername;
    avatar.textContent = (item.ownerUsername || "?").slice(0,1).toUpperCase();
    top.appendChild(avatar);
    const titleEl = document.createElement("div");
    titleEl.className = "task-title";
    titleEl.style.cursor = "default";
    titleEl.textContent = item.title;
    top.appendChild(titleEl);
    if(canUnpub || canAdminDel){
      const delBtn = document.createElement("button");
      delBtn.className = "icon-btn"; delBtn.textContent = "×";
      delBtn.title = canUnpub ? "Publicatie intrekken" : "Verwijderen uit algemene planning";
      delBtn.addEventListener("click", () => {
        state.published = state.published.filter(p => p.id !== item.id);
        const owner = item.ownerUid;
        let srcTask = null;
        if(state.usersData[owner] && state.usersData[owner].tasks) srcTask = state.usersData[owner].tasks.find(t => t.id === item.refTaskId);
        if(!srcTask) srcTask = state.sharedTasks.find(t => t.id === item.refTaskId);
        if(srcTask) srcTask.published = false;
        saveApp(); renderGeneralBoard();
        showToast(canUnpub ? "Publicatie ingetrokken." : "Item verwijderd uit algemene planning.");
      });
      top.appendChild(delBtn);
    }
    card.appendChild(top);

    const meta = document.createElement("div");
    meta.className = "task-meta";
    let metaHtml = "";

        const idx = dates.findIndex(d => toISO(d) === todayISO());
        genMobileDayIndex = idx >= 0 ? idx : 0;
      }
      dayTabsHolder.innerHTML = "";

    dayIndices.forEach(i => {
      const date = dates[i];
      const dateISO = toISO(date);
      const isToday = dateISO === todayISO();
      let items = state.published.filter(p => p.date === dateISO);
      if(genSelectedDept === "__none__") items = items.filter(p => !p.departmentId);
      else if(genSelectedDept !== "__all__") items = items.filter(p => p.departmentId === genSelectedDept);
      if(genFilterSubjectId) items = items.filter(p => p.subjectId === genFilterSubjectId);

  function renderChatTab(root){

      </div>

    renderChatMessages();

      const text = input.value.trim();
      if(!text) return;
      state.chat.push({ id: newId(), uid: currentUser, username: accountUsername(currentUser), text, at: new Date().toISOString(), reactions: {} });
      sendMentionNotifications(text, "de klassenchat");
      input.value = "";
      saveApp();
      renderChatMessages();
    };
    document.getElementById("chatSend").addEventListener("click", send);
    input.addEventListener("keydown", e => { if(e.key === "Enter") send(); });

  function renderChatMessages(){
    const box = document.getElementById("chatMessages");
    if(!box) return;
    if(state.chat.length === 0){
      box.innerHTML = `<div class="chat-empty">Nog geen berichten. Zeg iets!</div>`;
      return;
    }
    box.innerHTML = "";
    state.chat.forEach((m, idx) => {
      if(!m.id) m.id = newId() + "-" + idx; // vangnet voor oudere berichten zonder id
      const el = document.createElement("div");
      el.className = "chat-msg" + (m.uid === currentUser ? " own" : "");
      const time = new Date(m.at);
      const timeStr = pad(time.getHours()) + ":" + pad(time.getMinutes());

      const metaRow = document.createElement("div");
      metaRow.className = "meta";
      metaRow.innerHTML = `<strong>${escapeHtml(m.username)}</strong><span>${timeStr}${m.edited ? " · bewerkt" : ""}</span>`;
      if(m.uid === currentUser){
        const editBtn = document.createElement("button");
        editBtn.className = "icon-btn"; editBtn.title = "Bewerken"; editBtn.textContent = "✎";
        editBtn.style.padding = "0 3px";
        editBtn.addEventListener("click", () => { editingChatId = m.id; renderChatMessages(); });
        const delBtn = document.createElement("button");
        delBtn.className = "icon-btn"; delBtn.title = "Verwijderen"; delBtn.textContent = "×";
        delBtn.style.padding = "0 3px";
        delBtn.addEventListener("click", () => {
          if(!confirm("Dit bericht verwijderen?")) return;
          state.chat = state.chat.filter(x => x.id !== m.id);
          saveApp(); renderChatMessages();
        });
        metaRow.appendChild(editBtn); metaRow.appendChild(delBtn);
      }
      el.appendChild(metaRow);

      if(editingChatId === m.id){
        const editRow = document.createElement("div");
        editRow.style.display = "flex"; editRow.style.gap = "5px"; editRow.style.marginTop = "3px";
        const editInput = document.createElement("input");
        editInput.type = "text"; editInput.className = "field-input"; editInput.value = m.text;
        const saveEditBtn = document.createElement("button");
        saveEditBtn.className = "tool-btn"; saveEditBtn.textContent = "Opslaan"; saveEditBtn.type = "button";
        const doSave = () => {
          const val = editInput.value.trim();
          if(val){ m.text = val; m.edited = true; }
          editingChatId = null;
          saveApp(); renderChatMessages();
        };
        saveEditBtn.addEventListener("click", doSave);
        editInput.addEventListener("keydown", e => { if(e.key === "Enter") doSave(); if(e.key === "Escape"){ editingChatId = null; renderChatMessages(); } });
        editRow.appendChild(editInput); editRow.appendChild(saveEditBtn);
        el.appendChild(editRow);
        setTimeout(() => { editInput.focus(); editInput.select(); }, 0);
      } else {
        const textEl = document.createElement("div");
        textEl.innerHTML = renderMessageHtml(m.text);
        el.appendChild(textEl);
        el.appendChild(buildReactionBar(m, "chat:" + m.id, () => { saveApp(); renderChatMessages(); }));
      }

      box.appendChild(el);
    });
    box.scrollTop = box.scrollHeight;
  }

  function buildAdminCard(task){

    const card = document.createElement("div");
    card.className = "task-card" + (task.done ? " done" : "") + (!locked ? " locked" : "");
    card.style.setProperty("--subject-color", subject.color);
    card.style.setProperty("--subject-bg", subject.color + "22");

    const top = document.createElement("div");
    top.className = "task-top";
    const titleEl = document.createElement("div");
    titleEl.className = "task-title";
    titleEl.style.cursor = "default";
    titleEl.textContent = task.title;
    top.appendChild(titleEl);
    if(locked){
      const details = document.createElement("details");
      details.className = "kebab-wrap";
      const summary = document.createElement("summary");
      summary.className = "icon-btn kebab-btn"; summary.textContent = "⋯"; summary.title = "Meer opties";
      details.appendChild(summary);
      const menu = document.createElement("div");
      menu.className = "kebab-menu";
      const editBtn = document.createElement("button"); editBtn.type = "button"; editBtn.textContent = "Bewerken";

      const delBtn = document.createElement("button"); delBtn.type = "button"; delBtn.className = "danger"; delBtn.textContent = "Verwijderen";
      delBtn.addEventListener("click", () => {
        details.removeAttribute("open");
        state.usersData[adminPlanUid].tasks = state.usersData[adminPlanUid].tasks.filter(t => t.id !== task.id);

      });
      menu.appendChild(editBtn); menu.appendChild(delBtn);
      details.appendChild(menu);

      label.textContent = "eigen taak";
      top.appendChild(label);

    meta.className = "task-meta";

    metaHtml += `<span class="pill pill-subject"><span class="subject-dot"></span>${escapeHtml(subject.name)}</span>`;

  function deleteAccount(acc){
    if(acc.uid === currentUser){ showToast("Je kunt je eigen account hier niet verwijderen."); return; }
    if(!confirm("Weet je zeker dat je \"" + acc.username + "\" wilt verwijderen? Al hun taken, gedeelde taken en toegang tot de app worden verwijderd. Dit kan niet ongedaan gemaakt worden.")) return;

    state.accounts = state.accounts.filter(a => a.uid !== acc.uid);
    delete state.usersData[acc.uid];

    // gedeelde taken: verwijder taken die van deze persoon waren, en haal ze weg als deelnemer/genodigde elders
    state.sharedTasks = state.sharedTasks.filter(t => t.ownerUid !== acc.uid);
    state.sharedTasks.forEach(t => {
      t.participants = (t.participants || []).filter(u => u !== acc.uid);
      t.pendingInvites = (t.pendingInvites || []).filter(u => u !== acc.uid);
    });

    state.published = state.published.filter(p => p.ownerUid !== acc.uid);
    state.notifications = state.notifications.filter(n => n.toUid !== acc.uid && n.fromUid !== acc.uid);

    logActivity("verwijderde account \"" + acc.username + "\"");
    saveApp();
    drawAccounts();
    showToast("Account verwijderd uit de app. Let op: het inlogaccount in Firebase Authentication zelf verwijder je (indien gewenst) los, via de Firebase Console.");
  }

  function createAccount(username, pass, role, departmentIds){
    return new Promise((resolve, reject) => {
      username = (username || "").trim();
      if(!username || !pass){ reject(new Error("Vul gebruikersnaam en wachtwoord in.")); return; }
      if(pass.length < 6){ reject(new Error("Wachtwoord moet minstens 6 tekens zijn.")); return; }
      if(state.accounts.find(a => a.username.toLowerCase() === username.toLowerCase())){ reject(new Error("Deze gebruikersnaam bestaat al.")); return; }

      // Een losse, tijdelijke Firebase-sessie gebruiken om het account aan te maken,
      // zodat de beheerder niet zelf wordt uitgelogd (Firebase logt normaliter automatisch
      // in op een net aangemaakt account in dezelfde sessie).
      const secondaryApp = firebase.initializeApp(window.__firebaseConfig, "AccountCreator-" + Date.now() + "-" + Math.random().toString(36).slice(2,6));
      const secondaryAuth = secondaryApp.auth();
      secondaryAuth.createUserWithEmailAndPassword(username.toLowerCase() + EMAIL_SUFFIX, pass)
        .then(cred => {
          const uid = cred.user.uid;
          return secondaryAuth.signOut().then(() => uid);
        })
        .then(uid => {
          state.accounts.push({ uid, username, role: role === "admin" ? "admin" : "user", status: "approved", color: ACCOUNT_PALETTE[state.accounts.length % ACCOUNT_PALETTE.length], departments: Array.isArray(departmentIds) ? departmentIds : [], shareOwnTasksWithAdmin: false });
          ensureUserData(uid);
          logActivity("maakte account \"" + username + "\" aan (" + (role === "admin" ? "beheerder" : "gebruiker") + ")");
          saveApp();
          resolve(uid);
        })
        .catch(err => { reject(new Error(firebaseErrorToDutch(err))); })
        .finally(() => { secondaryApp.delete().catch(() => {}); });
    });
  }

  function createDepartment(name){
    name = (name || "").trim();
    if(!name) return;
    if(state.departments.find(d => d.name.toLowerCase() === name.toLowerCase())){ showToast("Deze afdeling bestaat al."); return; }
    state.departments.push({ id: newId(), name });
    logActivity("maakte afdeling \"" + name + "\" aan");
    saveApp(); drawAccounts();
  }
  function renameDepartment(dept, name){
    name = (name || "").trim();
    if(!name) return;
    const old = dept.name;
    dept.name = name;
    logActivity("hernoemde afdeling \"" + old + "\" naar \"" + name + "\"");
    saveApp(); drawAccounts();
  }
  function deleteDepartment(dept){
    if(!confirm("Afdeling \"" + dept.name + "\" verwijderen? Accounts en gepubliceerde items in deze afdeling vallen daarna terug naar \"Geen afdeling\".")) return;
    state.departments = state.departments.filter(d => d.id !== dept.id);
    state.accounts.forEach(a => { a.departments = accountDepartmentIds(a).filter(id => id !== dept.id); });
    state.published.forEach(p => { if(p.departmentId === dept.id) p.departmentId = null; });
    logActivity("verwijderde afdeling \"" + dept.name + "\"");
    saveApp(); drawAccounts();
  }

  function drawAccounts(){
    const wrap = document.getElementById("accWrap");
    wrap.innerHTML = "";

    const approvedUsers = state.accounts.filter(a => a.status === "approved" && a.uid !== currentUser);

    const deptSection = document.createElement("div");
    deptSection.className = "accounts-section";
    deptSection.innerHTML = `<h2>Afdelingen</h2><div class="empty-note" style="margin-bottom:8px;">Elke afdeling krijgt zijn eigen Algemene planning — accounts zien alleen de gepubliceerde taken van hun eigen afdeling.</div>`;
    if(state.departments.length === 0){
      deptSection.innerHTML += `<div class="empty-note" style="margin-bottom:8px;">Nog geen afdelingen aangemaakt.</div>`;
    } else {
      state.departments.forEach(dept => {
        const row = document.createElement("div");
        row.className = "account-row";
        const nameInput = document.createElement("input");
        nameInput.className = "field-input"; nameInput.type = "text"; nameInput.value = dept.name; nameInput.style.maxWidth = "220px";
        row.appendChild(nameInput);
        const actions = document.createElement("div");
        actions.className = "actions";
        const saveBtn = document.createElement("button");
        saveBtn.className = "assign-btn"; saveBtn.textContent = "Opslaan";
        saveBtn.addEventListener("click", () => renameDepartment(dept, nameInput.value));
        const delBtn = document.createElement("button");
        delBtn.className = "reject-btn"; delBtn.textContent = "Verwijderen";
        delBtn.addEventListener("click", () => deleteDepartment(dept));
        actions.appendChild(saveBtn); actions.appendChild(delBtn);
        row.appendChild(actions);
        deptSection.appendChild(row);
      });
    }
    const newDeptRow = document.createElement("div");
    newDeptRow.style.display = "flex"; newDeptRow.style.gap = "6px"; newDeptRow.style.marginTop = "6px"; newDeptRow.style.maxWidth = "340px";
    const newDeptInput = document.createElement("input");
    newDeptInput.className = "field-input"; newDeptInput.type = "text"; newDeptInput.placeholder = "Naam nieuwe afdeling";
    const newDeptBtn = document.createElement("button");
    newDeptBtn.className = "tool-btn"; newDeptBtn.textContent = "+ Toevoegen";
    newDeptBtn.addEventListener("click", () => { createDepartment(newDeptInput.value); });
    newDeptInput.addEventListener("keydown", e => { if(e.key === "Enter") createDepartment(newDeptInput.value); });
    newDeptRow.appendChild(newDeptInput); newDeptRow.appendChild(newDeptBtn);
    deptSection.appendChild(newDeptRow);
    wrap.appendChild(deptSection);

    const createSection = document.createElement("div");
    createSection.className = "accounts-section";
    const deptCheckboxesHtml = state.departments.length
      ? `<div style="display:flex; flex-direction:column; gap:3px; border:1.5px dashed var(--border); border-radius:6px; padding:7px;">` +
        `<div style="font-size:0.74rem; font-weight:600; color:var(--ink-soft);">Afdeling(en):</div>` +
        state.departments.map(d => `<label class="invite-row"><input type="checkbox" class="ca-dept-check" value="${d.id}"> ${escapeHtml(d.name)}</label>`).join("") +
        `</div>`
      : `<div class="empty-note">Nog geen afdelingen — maak er eerst een aan hierboven.</div>`;
    createSection.innerHTML = `
      <h2>Nieuw account aanmaken</h2>
      <div class="empty-note" style="margin-bottom:8px;">Jij als beheerder maakt alle accounts aan — mensen kunnen zich niet meer zelf registreren. Geef het wachtwoord door aan de betreffende persoon; die kan het later zelf wijzigen via "Profiel".</div>
      <div id="ca-msg"></div>
      <div style="display:flex; flex-direction:column; gap:6px; max-width:340px;">
        <input class="field-input" id="ca-user" type="text" placeholder="Gebruikersnaam">
        <input class="field-input" id="ca-pass" type="password" placeholder="Wachtwoord (minstens 6 tekens)">
        <select class="field-input" id="ca-role">
          <option value="user">Gebruiker</option>
          <option value="admin">Beheerder</option>
        </select>
        ${deptCheckboxesHtml}
        <button class="auth-submit" id="ca-submit" type="button" style="margin-top:2px;">Account aanmaken</button>
      </div>
    `;
    wrap.appendChild(createSection);
    const caMsg = createSection.querySelector("#ca-msg");
    createSection.querySelector("#ca-submit").addEventListener("click", () => {
      const btn = createSection.querySelector("#ca-submit");
      const username = createSection.querySelector("#ca-user").value;
      const pass = createSection.querySelector("#ca-pass").value;
      const role = createSection.querySelector("#ca-role").value;
      const departmentIds = Array.from(createSection.querySelectorAll(".ca-dept-check:checked")).map(cb => cb.value);
      caMsg.innerHTML = "";
      btn.disabled = true; btn.textContent = "Even geduld…";
      createAccount(username, pass, role, departmentIds)
        .then(() => {
          showToast("Account aangemaakt voor " + username.trim() + ".");
          drawAccounts();
        })
        .catch(err => {
          caMsg.innerHTML = `<div class="auth-error">${escapeHtml(err.message)}</div>`;
          btn.disabled = false; btn.textContent = "Account aanmaken";
        });

    });

    const usersSection = document.createElement("div");
    usersSection.className = "accounts-section";
    usersSection.innerHTML = `<h2>Accounts</h2>`;
    if(approvedUsers.length === 0){
      usersSection.innerHTML += `<div class="empty-note">Nog geen andere accounts aangemaakt.</div>`;
    } else {
      approvedUsers.forEach(acc => {
        const row = document.createElement("div");
        row.className = "account-row";
        ensureUserData(acc.uid);
        const userTasks = state.usersData[acc.uid].tasks;
        const lockedTasks = userTasks.filter(t => t.lockedByAdmin);

        const top = document.createElement("div");
        top.style.display = "flex"; top.style.justifyContent = "space-between"; top.style.width = "100%"; top.style.alignItems = "center";
        top.innerHTML = `<span class="uname"><span class="account-color-dot" style="background:${acc.color}"></span>${escapeHtml(acc.username)}${acc.role === "admin" ? '<span class="role-badge">beheerder</span>' : ''}</span>`;
        const openInAdminBtn = document.createElement("button");
        openInAdminBtn.className = "assign-btn"; openInAdminBtn.textContent = "Open in Planning maken";
        openInAdminBtn.addEventListener("click", () => { adminPlanUid = acc.uid; activeTab = "adminplan"; renderApp(); });
        const deleteAccBtn = document.createElement("button");
        deleteAccBtn.className = "reject-btn"; deleteAccBtn.textContent = "Account verwijderen";
        deleteAccBtn.addEventListener("click", () => { deleteAccount(acc); });
        const actionsWrap = document.createElement("div"); actionsWrap.className = "actions";
        actionsWrap.appendChild(openInAdminBtn); actionsWrap.appendChild(deleteAccBtn);
        top.appendChild(actionsWrap);
        row.appendChild(top);

        const deptRow = document.createElement("div");
        deptRow.style.display = "flex"; deptRow.style.flexWrap = "wrap"; deptRow.style.alignItems = "center"; deptRow.style.gap = "8px"; deptRow.style.marginTop = "4px";
        const deptLabel = document.createElement("span");
        deptLabel.textContent = "Afdeling(en):"; deptLabel.style.fontSize = "0.78rem"; deptLabel.style.color = "var(--ink-soft)";
        deptRow.appendChild(deptLabel);
        if(state.departments.length === 0){
          const none = document.createElement("span");
          none.className = "empty-note"; none.textContent = "geen afdelingen aangemaakt";
          deptRow.appendChild(none);
        } else {
          const currentIds = accountDepartmentIds(acc);
          state.departments.forEach(d => {
            const lbl = document.createElement("label");
            lbl.style.display = "inline-flex"; lbl.style.alignItems = "center"; lbl.style.gap = "4px"; lbl.style.fontSize = "0.78rem"; lbl.style.cursor = "pointer";
            const cb = document.createElement("input");
            cb.type = "checkbox"; cb.checked = currentIds.includes(d.id);
            cb.addEventListener("change", () => {
              const ids = new Set(accountDepartmentIds(acc));
              if(cb.checked) ids.add(d.id); else ids.delete(d.id);
              acc.departments = Array.from(ids);
              logActivity((cb.checked ? "voegde " : "verwijderde ") + acc.username + (cb.checked ? " toe aan" : " uit") + " afdeling \"" + d.name + "\"");
              saveApp();
              showToast(acc.username + " zit nu bij: " + departmentNamesList(acc) + ".");
            });
            lbl.appendChild(cb); lbl.appendChild(document.createTextNode(d.name));
            deptRow.appendChild(lbl);
          });
        }
        row.appendChild(deptRow);

        if(lockedTasks.length){
          const lockedWrap = document.createElement("div");
          lockedWrap.style.width = "100%";
          lockedTasks.forEach(t => {
            const lr = document.createElement("div");
            lr.className = "locked-task-row";
            lr.innerHTML = `<span>🔒 ${escapeHtml(t.title)} — ${escapeHtml(t.date)}</span>`;
            const delBtn = document.createElement("button");
            delBtn.textContent = "×"; delBtn.title = "Verwijderen";
            delBtn.addEventListener("click", () => {
              state.usersData[acc.uid].tasks = userTasks.filter(x => x.id !== t.id);
              saveApp(); drawAccounts();
            });
            lr.appendChild(delBtn);
            lockedWrap.appendChild(lr);
          });
          row.appendChild(lockedWrap);
        }

        usersSection.appendChild(row);
      });
    }
    wrap.appendChild(usersSection);

    const logSection = document.createElement("div");
    logSection.className = "accounts-section";
    logSection.innerHTML = `<h2>Activiteitenlogboek</h2>`;
    if(state.activityLog.length === 0){
      logSection.innerHTML += `<div class="empty-note">Nog geen beheerdersacties gelogd.</div>`;
    } else {
      const logList = document.createElement("div");
      logList.style.maxHeight = "260px"; logList.style.overflowY = "auto"; logList.style.display = "flex"; logList.style.flexDirection = "column"; logList.style.gap = "4px";
      state.activityLog.slice(0, 30).forEach(entry => {
        const row = document.createElement("div");
        row.style.fontSize = "0.8rem"; row.style.padding = "5px 8px"; row.style.borderRadius = "5px"; row.style.background = "var(--paper)";
        const time = new Date(entry.at);
        row.innerHTML = `<span style="color:var(--ink-soft);">${pad(time.getDate())}-${pad(time.getMonth()+1)} ${pad(time.getHours())}:${pad(time.getMinutes())}</span> — <strong>${escapeHtml(entry.actorUsername)}</strong> ${escapeHtml(entry.text)}`;
        logList.appendChild(row);
      });
      logSection.appendChild(logList);
    }
    wrap.appendChild(logSection);

    const backupSection = document.createElement("div");
    backupSection.className = "accounts-section";
    backupSection.innerHTML = `<h2>Volledige backup</h2><div class="empty-note">Bevat alle accounts (met versleutelde wachtwoorden), taken, gedeelde taken, meldingen, chat en publicaties. Alleen voor jou als beheerder.</div>`;
    const backupBtns = document.createElement("div");
    backupBtns.style.display = "flex"; backupBtns.style.gap = "8px"; backupBtns.style.marginTop = "10px";
    const expBtn = document.createElement("button"); expBtn.className = "tool-btn"; expBtn.textContent = "⬇ Volledige backup";
    const impBtn = document.createElement("button"); impBtn.className = "tool-btn"; impBtn.textContent = "⬆ Volledig herstellen";
    const fileInput = document.createElement("input"); fileInput.type = "file"; fileInput.accept = "application/json"; fileInput.style.display = "none";
    expBtn.addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a"); a.href = url; a.download = "planning-volledige-backup-" + todayISO() + ".json"; a.click();
      URL.revokeObjectURL(url);
    });
    impBtn.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try{
          const parsed = JSON.parse(reader.result);
          if(!parsed || !Array.isArray(parsed.accounts)) throw new Error("ongeldig");
          state.accounts = parsed.accounts;
          state.usersData = parsed.usersData || {};
          state.subjects = Array.isArray(parsed.subjects) && parsed.subjects.length ? parsed.subjects : DEFAULT_SUBJECTS.slice();
          state.published = Array.isArray(parsed.published) ? parsed.published : [];
          state.chat = Array.isArray(parsed.chat) ? parsed.chat : [];
          state.sharedTasks = Array.isArray(parsed.sharedTasks) ? parsed.sharedTasks : [];
          state.notifications = Array.isArray(parsed.notifications) ? parsed.notifications : [];
          state.departments = Array.isArray(parsed.departments) ? parsed.departments : [];
          state.activityLog = Array.isArray(parsed.activityLog) ? parsed.activityLog : [];
          mergeDefaultSubjects(); normalizeAllTasks(); normalizeSharedTasks(); normalizeAccounts();
          saveApp(); drawAccounts();
          showToast("Volledige backup teruggezet.");
        }catch(e){ showToast("Kon dit bestand niet lezen."); }
      };
      reader.readAsText(file);
      fileInput.value = "";
    });
    backupBtns.appendChild(expBtn); backupBtns.appendChild(impBtn); backupBtns.appendChild(fileInput);
    backupSection.appendChild(backupBtns);
    wrap.appendChild(backupSection);
  }

  /* ============ init ============ */
  function boot(){
    document.getElementById("app").innerHTML = `
      <div class="auth-wrap"><div class="auth-card">
        <h1>Laden…</h1>
        <div class="sub">Verbinden met de database.</div>
      </div></div>`;
    db.collection("meta").doc("setup").get().then(snap => {
      needsAdminSetup = !(snap.exists && snap.data() && snap.data().initialized === true);
      auth.onAuthStateChanged(user => {
        if(user){
          currentUser = user.uid;
          subscribeState(() => {
            const acc = findAccountByUid(currentUser);
            if(!acc || acc.status === "pending"){
              currentUser = null;
              auth.signOut();
              authMode = "login";
              authError = !acc ? "Je account bestaat niet meer." : "Dit account wacht nog op goedkeuring van de beheerder.";
              renderAuth();
            } else {
              activeTab = activeTab || "mine";
              renderApp();
            }
          });
        } else {
          currentUser = null;
          if(unsubscribeSnapshot){ unsubscribeSnapshot(); unsubscribeSnapshot = null; }
          renderAuth();
        }
      });
    }).catch(err => {
      console.error("Firestore verbinding mislukt", err);
      document.getElementById("app").innerHTML = `
        <div class="auth-wrap"><div class="auth-card">
          <h1>Geen verbinding</h1>
          <div class="auth-error">Kon geen verbinding maken met de database. Controleer of firebaseConfig hierboven is ingevuld en of de Firestore-rules gepubliceerd zijn.</div>
        </div></div>`;
    });
  }
  // herrender het huidige bord als het scherm de telefoon/desktop-grens passeert (bv. bij draaien van het toestel)
  let resizeTimer = null;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if(document.getElementById("board")) renderBoard();
      else if(document.getElementById("genBoard")) renderGeneralBoard();
      else if(document.getElementById("adminBoard")) renderAdminBoard();
    }, 200);
  });

  boot();
})();
</script>
</body>
</html>
