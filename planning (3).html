<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planning</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

:root{
  --paper: #F1F3EC;
  --paper-line: #DEE3D6;
  --card: #FFFDF8;
  --ink: #202A24;
  --ink-soft: #5B6459;
  --accent: #2F5233;
  --accent-soft: #DCE6DA;
  --border: #CBD3C3;
  --hoog: #C1543B;
  --hoog-bg: #F6E1DB;
  --gem: #C98A2C;
  --gem-bg: #F4E7CD;
  --laag: #4472A8;
  --laag-bg: #DEE7F1;
  --time-ink: #3A4A63;
  --time-bg: #E4E9F1;
  --shadow-rest: 0 1px 3px rgba(32,42,36,0.06);
  --shadow-hover: 0 4px 14px rgba(32,42,36,0.14);
  --radius: 10px;
  --radius-sm: 7px;
}

:root[data-theme="dark"]{
  --paper:#1C201B;
  --paper-line:#2B302A;
  --card:#242920;
  --ink:#E9ECE3;
  --ink-soft:#9FA79A;
  --accent:#7FB98C;
  --accent-soft:#2E3B2E;
  --border:#3A4038;
  --hoog:#E08A73;
  --hoog-bg:#4A2C24;
  --gem:#E0B25C;
  --gem-bg:#4A3B1E;
  --laag:#8FB6E0;
  --laag-bg:#243347;
  --time-ink:#9DB6E0;
  --time-bg:#232C3A;
  --shadow-rest: 0 1px 3px rgba(0,0,0,0.35);
  --shadow-hover: 0 4px 14px rgba(0,0,0,0.5);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'IBM Plex Sans', sans-serif;
  color:var(--ink);
  background-color:var(--paper);
  background-image: repeating-linear-gradient(to bottom, transparent, transparent 27px, var(--paper-line) 28px);
  min-height:100vh;
}
h1,h2,h3{font-family:'Fraunces', serif; margin:0;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

/* ---------- shared inputs ---------- */
.field-input{
  font-size:0.85rem;
  padding:8px 10px;
  border-radius:6px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--ink);
  width:100%;
}

/* ---------- auth screens ---------- */
.auth-wrap{
  display:flex; align-items:center; justify-content:center;
  min-height:100vh; padding:24px;
}
.auth-card{
  background:var(--card);
  border:1.5px solid var(--ink);
  border-radius:var(--radius);
  padding:30px 28px;
  width:100%; max-width:380px;
  display:flex; flex-direction:column; gap:12px;
  box-shadow:var(--shadow-hover);
}
.auth-card h1{font-size:1.6rem;}
.auth-card .sub{font-size:0.82rem; color:var(--ink-soft); margin-top:-6px;}
.auth-note{font-size:0.74rem; color:var(--ink-soft); line-height:1.45; background:var(--accent-soft); padding:9px 11px; border-radius:6px;}
.auth-error{font-size:0.8rem; color:var(--hoog); background:var(--hoog-bg); padding:8px 10px; border-radius:6px;}
.auth-success{font-size:0.8rem; color:var(--accent); background:var(--accent-soft); padding:8px 10px; border-radius:6px;}
.auth-card label{font-size:0.76rem; font-weight:600; color:var(--ink-soft); margin-bottom:-6px;}
.auth-submit{
  background:var(--accent); color:#fff; border:1.5px solid var(--accent);
  border-radius:6px; padding:10px; font-weight:600; font-size:0.88rem; cursor:pointer; margin-top:4px;
}
.auth-switch{
  font-size:0.8rem; text-align:center; color:var(--ink-soft); cursor:pointer;
  text-decoration:underline; background:none; border:none; padding:2px;
}

/* ---------- nav ---------- */
.nav{
  display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
  padding:18px 32px;
  border-bottom:2px solid var(--ink);
}
.nav-brand{display:flex; align-items:baseline; gap:10px;}
.nav-brand h1{font-size:1.5rem;}
.nav-brand .who{font-size:0.78rem; color:var(--ink-soft); display:inline-flex; align-items:center;}
.role-badge{
  font-size:0.65rem; font-weight:700; padding:2px 7px; border-radius:10px;
  background:var(--accent-soft); color:var(--accent); text-transform:none; margin-left:4px;
}
.account-color-dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; flex-shrink:0;}
.nav-tabs{display:flex; gap:4px; flex-wrap:wrap;}
.nav-tab{
  padding:7px 14px; border-radius:20px; cursor:pointer; font-weight:600; font-size:0.82rem;
  color:var(--ink-soft); border:1.5px solid transparent; background:none;
}
.nav-tab.active{background:var(--accent-soft); color:var(--ink); border-color:var(--ink);}
.nav-actions{display:flex; gap:8px; align-items:center;}
.tool-btn{
  background:var(--card);
  border:1.5px solid var(--ink);
  color:var(--ink);
  border-radius:var(--radius-sm);
  height:34px;
  padding:0 12px;
  font-size:0.8rem;
  font-weight:600;
  cursor:pointer;
  display:flex; align-items:center; gap:5px;
}
.tool-btn:hover{background:var(--accent-soft);}
.tool-btn.active{background:var(--accent); color:#fff; border-color:var(--accent);}
.theme-btn{width:34px; padding:0; justify-content:center; font-size:1rem;}

/* ---------- notifications ---------- */
.notif-wrap{position:relative;}
.notif-wrap > summary{list-style:none; cursor:pointer;}
.notif-wrap > summary::-webkit-details-marker{display:none;}
.bell-btn{width:34px; padding:0; justify-content:center; font-size:1rem; position:relative;}
.notif-badge{
  position:absolute; top:-5px; right:-5px; background:var(--hoog); color:#fff;
  font-size:0.6rem; font-weight:700; border-radius:10px; min-width:16px; height:16px;
  display:flex; align-items:center; justify-content:center; padding:0 3px; border:1.5px solid var(--paper);
}
.notif-panel{
  position:absolute; right:0; top:calc(100% + 6px); width:300px; max-height:380px; overflow-y:auto;
  background:var(--card); border:1.5px solid var(--ink); border-radius:8px; box-shadow:var(--shadow-hover);
  padding:8px; z-index:40; display:flex; flex-direction:column; gap:8px;
}
.notif-item{border:1px solid var(--border); border-radius:6px; padding:9px; font-size:0.8rem; display:flex; flex-direction:column; gap:7px; text-align:left;}
.notif-actions{display:flex; gap:6px;}
.notif-actions button{flex:1; font-size:0.74rem; font-weight:600; padding:6px; border-radius:5px; cursor:pointer; border:1.5px solid var(--ink);}

/* ---------- header (mine tab) ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px;
  padding:20px 32px 12px;
}
.weeknav{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.weeknav button{
  background:var(--card); border:1.5px solid var(--ink); color:var(--ink);
  border-radius:var(--radius-sm); width:34px; height:34px; font-size:1rem; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.weeknav button:hover{background:var(--accent-soft);}
.weeknav .today-btn{width:auto; padding:0 14px; font-weight:600; font-size:0.85rem;}
.weekrange{font-weight:600; font-size:1rem; min-width:170px; text-align:center;}
.stats{font-size:0.85rem; color:var(--ink-soft); display:flex; align-items:center; gap:8px;}
.stats strong{color:var(--ink);}
.week-progress-track{width:80px; height:5px; border-radius:4px; background:var(--paper-line); overflow:hidden;}
.week-progress-fill{height:100%; border-radius:4px; background:var(--accent); transition: width .25s ease;}

.toolbar{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:6px 32px 0;}
.search-input{
  font-size:0.85rem; padding:8px 12px; border-radius:20px; border:1.5px solid var(--border);
  background:var(--card); color:var(--ink); min-width:220px; flex:1; max-width:320px;
}
.toolbar-actions{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}

.filters{display:flex; flex-wrap:wrap; gap:6px; padding:12px 32px 0;}
.chip{
  font-size:0.74rem; font-weight:600; padding:4px 11px; border-radius:20px;
  border:1.5px solid var(--border); background:var(--card); color:var(--ink-soft); cursor:pointer;
}
.chip.active{border-color:var(--chip-color, var(--ink)); background:var(--chip-bg, var(--accent-soft)); color:var(--chip-color, var(--ink));}
.gen-legend{display:flex; flex-wrap:wrap; gap:7px; padding:2px 32px 14px;}
.gen-legend .chip{cursor:default;}

/* ---------- board ---------- */
.board{display:grid; grid-template-columns: repeat(7, minmax(250px, 1fr)); gap:14px; padding:22px 32px 60px; overflow-x:auto;}
.column{
  background:var(--card); border:1.5px solid var(--border); border-radius:var(--radius);
  display:flex; flex-direction:column; min-height:400px; box-shadow:var(--shadow-rest);
}
.column-head{padding:14px 14px 10px; border-bottom:1.5px solid var(--paper-line);}
.column-head.is-today{background:var(--accent-soft); border-radius: var(--radius) var(--radius) 0 0;}
.day-name{font-size:1.05rem; font-weight:600;}
.day-date{font-size:0.78rem; color:var(--ink-soft); margin-top:2px;}
.day-progress-row{display:flex; align-items:center; justify-content:space-between; gap:6px; margin-top:6px;}
.day-progress{font-size:0.72rem; color:var(--ink-soft);}
.day-progress.celebrate{color:var(--accent); font-weight:600;}
.clear-done{background:none; border:none; color:var(--ink-soft); font-size:0.68rem; text-decoration:underline; cursor:pointer; padding:0; white-space:nowrap;}
.clear-done:hover{color:var(--hoog);}
.progress-track{height:5px; border-radius:4px; background:var(--paper-line); overflow:hidden; margin-top:8px;}
.progress-fill{height:100%; border-radius:4px; background:var(--accent); transition: width .25s ease;}

.section-label{display:flex; align-items:baseline; justify-content:space-between; gap:6px; font-size:0.72rem; font-weight:600; color:var(--ink-soft); padding:8px 14px 4px;}
.section-label .suffix{font-size:0.68rem; font-weight:500; color:var(--ink-soft); opacity:0.8;}
.section-divider{height:1.5px; background:var(--paper-line); margin:2px 10px;}

.list{min-height:34px; display:flex; flex-direction:column; gap:8px; padding:2px 10px 6px; border-radius:6px;}
.list.drag-over{box-shadow: 0 0 0 2px var(--accent-soft) inset;}
.empty-hint{font-size:0.72rem; color:var(--ink-soft); font-style:italic; padding:4px 6px 8px;}

.task-card{
  background:var(--paper); border:1px solid var(--border); border-left:5px solid var(--subject-color, var(--accent));
  border-radius:var(--radius-sm); padding:10px 11px; cursor:grab;
  display:flex; flex-direction:column; gap:6px;
  animation: fadeIn .18s ease;
  transition: box-shadow .15s ease, transform .15s ease;
}
@keyframes fadeIn{ from{opacity:0; transform:translateY(-2px);} to{opacity:1; transform:translateY(0);} }
.task-card:hover{box-shadow: var(--shadow-hover); transform:translateY(-1px);}
.task-card.dragging{opacity:0.35;}
.task-card.done{opacity:0.6;}
.task-card.done .task-title{text-decoration: line-through;}
.task-card.locked{cursor:default;}
.task-card.shared{border-left-width:5px;}

.task-top{display:flex; align-items:flex-start; gap:7px;}
.task-top input[type=checkbox]{margin-top:3px; width:15px; height:15px; accent-color:var(--accent); cursor:pointer; flex-shrink:0;}
.task-title{font-size:0.87rem; font-weight:500; line-height:1.35; flex:1; word-break:break-word; cursor:pointer;}
.task-title:hover{text-decoration:underline; text-decoration-color:var(--border);}
.icon-btn{background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:0.85rem; line-height:1; padding:3px 5px; border-radius:4px; flex-shrink:0;}
.icon-btn:hover{background:var(--border); color:var(--ink);}
.publish-btn.active{color:var(--accent);}
.notes-btn.has-notes{color:var(--accent);}
.chat-toggle-btn.active{color:var(--accent);}
.repeat-badge{opacity:0.65;}

/* kebab dropdown */
.kebab-wrap{position:relative;}
.kebab-wrap > summary{list-style:none; cursor:pointer;}
.kebab-wrap > summary::-webkit-details-marker{display:none;}
.kebab-btn{font-weight:700; letter-spacing:1px;}
.kebab-menu{
  position:absolute; right:0; top:calc(100% + 4px); background:var(--card); border:1.5px solid var(--ink);
  border-radius:8px; box-shadow:var(--shadow-hover); display:flex; flex-direction:column;
  min-width:200px; z-index:25; padding:4px;
}
.kebab-menu button{background:none; border:none; text-align:left; padding:8px 10px; font-size:0.8rem; border-radius:5px; cursor:pointer; color:var(--ink); width:100%;}
.kebab-menu button:hover{background:var(--accent-soft);}
.kebab-menu button.danger{color:var(--hoog);}
.kebab-menu button.danger:hover{background:var(--hoog-bg);}

.task-meta{display:flex; flex-wrap:wrap; align-items:center; gap:5px; padding-left:22px;}
.pill{font-size:0.68rem; font-weight:600; padding:2px 7px; border-radius:20px; white-space:nowrap; display:inline-flex; align-items:center;}
.pill-subject{background: var(--subject-bg, var(--accent-soft)); color: var(--subject-color, var(--accent));}
.subject-dot{display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:5px; background:currentColor;}
.pill-prio-hoog{background:var(--hoog-bg); color:var(--hoog);}
.pill-prio-gemiddeld{background:var(--gem-bg); color:var(--gem);}
.pill-prio-laag{background:var(--laag-bg); color:var(--laag);}
.pill-time{background:var(--time-bg); color:var(--time-ink); font-variant-numeric: tabular-nums;}
.pill-locked{background:var(--gem-bg); color:var(--gem);}
.pill-neutral{background:var(--paper-line); color:var(--ink-soft);}
.pill-owner{background:var(--laag-bg); color:var(--laag);}
.task-location{font-size:0.72rem; color:var(--ink-soft); padding-left:22px;}

.avatar-row{display:flex; gap:3px; align-items:center; margin-left:2px;}
.avatar-chip{
  --avatar-color:#888; width:19px; height:19px; border-radius:50%; background:var(--avatar-color);
  color:#fff; font-size:0.6rem; font-weight:700; display:flex; align-items:center; justify-content:center;
  flex-shrink:0; border:1.5px solid var(--paper);
}

.notes-area{width:100%; font-size:0.78rem; padding:6px 7px; border-radius:5px; border:1px solid var(--border); background:var(--card); color:var(--ink); resize:vertical; min-height:44px;}

/* invite panel */
.invite-panel{margin-left:22px; border:1.5px dashed var(--border); border-radius:6px; padding:9px; display:flex; flex-direction:column; gap:7px;}
.invite-row{display:flex; align-items:center; gap:7px; font-size:0.8rem; cursor:pointer;}
.invite-row input{accent-color:var(--accent); cursor:pointer;}

/* task chat panel */
.chat-panel{margin-left:22px; border:1px solid var(--border); border-radius:6px; background:var(--card); padding:8px; display:flex; flex-direction:column; gap:7px;}
.chat-panel-messages{max-height:170px; overflow-y:auto; display:flex; flex-direction:column; gap:5px;}
.chat-panel-msg{font-size:0.74rem; background:var(--paper); border-radius:5px; padding:5px 8px; line-height:1.4;}
.chat-panel-msg.own{background:var(--accent-soft);}
.chat-panel-msg .meta{color:var(--ink-soft); font-size:0.65rem; margin-left:5px; font-weight:400;}
.chat-panel-input-row{display:flex; gap:6px;}
.chat-panel-input-row input{flex:1;}
.chat-panel-input-row button{padding:0 12px; border-radius:6px; border:1.5px solid var(--ink); background:var(--accent); color:#fff; cursor:pointer; font-weight:700;}

/* subtaken/checklist */
.subtasks-panel{margin-left:22px; border:1px solid var(--border); border-radius:6px; background:var(--card); padding:8px; display:flex; flex-direction:column; gap:6px;}
.subtask-row{display:flex; align-items:center; gap:7px; font-size:0.8rem;}
.subtask-row input[type=checkbox]{accent-color:var(--accent); cursor:pointer; flex-shrink:0;}
.subtask-row .st-text{flex:1;}
.subtask-row.done .st-text{text-decoration:line-through; color:var(--ink-soft);}
.subtask-row .icon-btn{padding:2px 5px;}
.subtasks-add-row{display:flex; gap:5px; margin-top:2px;}
.subtasks-add-row input{flex:1;}
.subtasks-progress{font-size:0.68rem; color:var(--ink-soft); font-weight:600;}

/* reacties op berichten */
.reaction-row{display:flex; flex-wrap:wrap; gap:4px; align-items:center; margin-top:3px;}
.reaction-pill{font-size:0.7rem; padding:1px 7px; border-radius:12px; border:1.5px solid var(--border); background:var(--paper); cursor:pointer; display:inline-flex; gap:3px;}
.reaction-pill.mine{border-color:var(--accent); background:var(--accent-soft);}
.reaction-add-btn{font-size:0.72rem; padding:1px 6px; border-radius:12px; border:1.5px dashed var(--border); background:none; color:var(--ink-soft); cursor:pointer;}
.reaction-picker{display:flex; gap:3px; background:var(--card); border:1.5px solid var(--ink); border-radius:20px; padding:3px 6px; box-shadow:var(--shadow-hover);}
.reaction-picker button{background:none; border:none; font-size:1rem; cursor:pointer; padding:1px 3px;}

/* vandaag-overzicht */
.today-box{margin:14px 32px 0; border:1.5px solid var(--ink); border-radius:var(--radius); background:var(--accent-soft); overflow:hidden;}
.today-box-head{display:flex; align-items:center; justify-content:space-between; padding:10px 16px; cursor:pointer;}
.today-box-head h3{font-size:1rem;}
.today-box-body{padding:0 16px 14px; display:flex; flex-direction:column; gap:6px;}
.today-mini-item{display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--border); border-left:4px solid var(--subject-color, var(--accent)); border-radius:6px; padding:6px 9px; font-size:0.82rem;}
.today-mini-item.done{opacity:0.55; text-decoration:line-through;}
.today-mini-item .tm-time{font-variant-numeric:tabular-nums; color:var(--time-ink); font-weight:600; flex-shrink:0;}
.today-empty{font-size:0.82rem; color:var(--ink-soft); font-style:italic;}

/* thema-kleuren (profiel) */
.theme-swatch{width:30px; height:30px; border-radius:50%; cursor:pointer; border:1.5px solid var(--border);}
.theme-swatch.active{border:3px solid var(--ink);}

.add-task-wrap{padding:8px 10px 14px;}
.add-btn{
  width:100%; background:none; border:1.5px dashed var(--border); border-radius:var(--radius-sm);
  padding:8px; color:var(--ink-soft); font-size:0.82rem; font-weight:600; cursor:pointer;
}
.add-btn:hover{border-color:var(--accent); color:var(--accent);}

.add-form{display:flex; flex-direction:column; gap:6px; background:var(--paper); border:1.5px solid var(--ink); border-radius:var(--radius-sm); padding:9px;}
.type-toggle{display:flex; gap:6px;}
.type-toggle label{flex:1; text-align:center; font-size:0.76rem; font-weight:600; padding:6px 4px; border:1.5px solid var(--border); border-radius:5px; cursor:pointer; color:var(--ink-soft); background:var(--card);}
.type-toggle input{position:absolute; opacity:0; pointer-events:none;}
.type-toggle label.active{border-color:var(--ink); background:var(--accent-soft); color:var(--ink);}
.add-form input[type=text], .add-form input[type=time], .add-form input[type=date], .add-form select{
  font-size:0.82rem; padding:6px 7px; border-radius:5px; border:1px solid var(--border);
  background:var(--card); color:var(--ink); width:100%;
}
.add-form .row{display:flex; gap:6px;}
.add-form .row > *{flex:1; min-width:0;}
.repeat-row{display:flex; align-items:center; gap:6px; font-size:0.78rem; color:var(--ink-soft);}
.repeat-row input[type=checkbox]{width:14px; height:14px; accent-color:var(--accent); cursor:pointer;}
.repeat-row input[type=number]{width:52px; padding:4px 6px; border-radius:5px; border:1px solid var(--border); background:var(--card); font-size:0.78rem;}
.add-form .actions{display:flex; gap:6px; margin-top:2px;}
.add-form .actions button{flex:1; font-size:0.78rem; font-weight:600; padding:6px; border-radius:5px; cursor:pointer; border:1.5px solid var(--ink);}
.add-form .save-btn{background:var(--accent); color:#fff; border-color:var(--accent);}
.add-form .cancel-btn{background:var(--card); color:var(--ink);}

/* ---------- chat (klas-chat) ---------- */
.chat-wrap{display:flex; flex-direction:column; height:calc(100vh - 150px); max-width:640px; margin:0 auto; padding:0 32px 20px;}
.chat-messages{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding:14px 0;}
.chat-empty{color:var(--ink-soft); font-size:0.85rem; text-align:center; margin-top:30px;}
.chat-msg{background:var(--card); border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px 11px; max-width:78%; align-self:flex-start;}
.chat-msg.own{align-self:flex-end; background:var(--accent-soft); border-color:var(--accent);}
.chat-msg .meta{font-size:0.68rem; color:var(--ink-soft); margin-bottom:2px; display:flex; gap:6px;}
.chat-input-row{display:flex; gap:8px; padding:10px 0; border-top:1.5px solid var(--paper-line);}
.chat-input-row input{flex:1;}
.chat-note{font-size:0.7rem; color:var(--ink-soft); text-align:center; padding-bottom:6px;}

/* ---------- accounts (admin) ---------- */

.toast-container{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:8px; z-index:50;}
.toast{background:var(--ink); color:var(--paper); border-radius:var(--radius-sm); padding:10px 14px; font-size:0.82rem; display:flex; align-items:center; gap:12px; box-shadow:var(--shadow-hover); animation: toastIn .18s ease;}
.toast button{background:none; border:none; color:var(--accent-soft); font-weight:700; font-size:0.82rem; cursor:pointer; text-decoration:underline; white-space:nowrap;}

<body>

<div id="app"></div>
<div class="toast-container" id="toastContainer"></div>

<!--
  ========================================================================
  FIREBASE INSTELLEN (eenmalig, ± 5 minuten):
  1. Ga naar https://console.firebase.google.com en maak een gratis project.
  2. Links in het menu: "Build" > "Firestore Database" > "Create database"
     -> kies "Start in production mode" (de rules hieronder regelen de toegang).
  3. Links in het menu: "Build" > "Authentication" > "Get started"
     -> tabblad "Sign-in method" > zet "Email/Password" aan.
  4. Tandwiel-icoon > "Project settings" > onderaan "Your apps" > klik het
     </> (web) icoon > geef een naam > "Register app".
     Je krijgt een blokje met apiKey, authDomain, projectId, etc. Plak dat
     hieronder in firebaseConfig (vervang de "PLAK_HIER..." teksten).
  5. In Firestore > tabblad "Rules", plak dit en klik "Publish":

     rules_version = '2';
     service cloud.firestore {
       match /databases/{database}/documents {
         match /meta/setup {
           allow read: if true;
           allow write: if request.auth != null;
         }
         match /appState/main {
           allow read, write: if request.auth != null;
         }
       }
     }

  Let op: "allow write/read: if request.auth != null" betekent alleen dat
  je moet zijn ingelogd — het is geen fijnmazige beveiliging (elke
  ingelogde gebruiker kan technisch bij de hele database, ook elkaars
  taken). Voor een schoolproject is dat een bewuste, uitgelegde keuze;
  voor iets met echt gevoelige data zou je dit verder moeten opsplitsen.
  De "meta/setup" plek mag door iedereen (ook uitgelogd) gelezen worden —
  dat bevat alleen een aan/uit-vlaggetje, geen persoonsgegevens, en is
  nodig om te weten of de allereerste beheerder al is aangemaakt.
  ========================================================================
-->

<script>
(function(){
  const DAY_NAMES = ["Maandag","Dinsdag","Woensdag","Donderdag","Vrijdag","Zaterdag","Zondag"];
  const MONTHS = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
  const SUBJECT_PALETTE = ["#C1543B","#C98A2C","#4472A8","#7B4B94","#2C8C82","#B85C7D","#7C8A3C","#33547A","#D97E3D","#5B5EA6","#3F8F6B","#8A7157"];
  const ACCOUNT_PALETTE = ["#4472A8","#C1543B","#3F8F6B","#7B4B94","#C98A2C","#33547A","#B85C7D","#2C8C82","#8A7157","#5B5EA6","#D97E3D","#7C8A3C"];
  const DEFAULT_SUBJECT_NAMES = ["Nederlands","Engels","Duits","Wiskunde B","Natuurkunde","Scheikunde","Biologie","Informatica","Sport","Werk","Familie","Overig"];
  const DEFAULT_SUBJECTS = DEFAULT_SUBJECT_NAMES.map((name, i) => ({ id: "s"+i, name, color: SUBJECT_PALETTE[i % SUBJECT_PALETTE.length] }));

  const auth = window.__auth;
  const db = window.__db;
  const EMAIL_SUFFIX = "@planning.local"; // trucje: gebruikersnaam wordt intern een e-mailadres voor Firebase Auth
  const THEME_KEY = "planning-theme";

  let state = { accounts: [], usersData: {}, subjects: DEFAULT_SUBJECTS.slice(), published: [], chat: [], sharedTasks: [], notifications: [], departments: [], activityLog: [] };
  let firestoreReady = false;
  let currentUser = null;
  let needsAdminSetup = false;
  let authMode = "login";
  let authError = "";
  let authSuccess = "";
  let activeTab = "mine";

  // mine-tab UI state
  let weekOffset = 0;
  let openForm = null;
  let editingId = null;
  let draggingId = null;
  let draggingType = null;
  let filterSubjectId = null;
  let expandedNotes = new Set();
  let expandedInvite = new Set();
  let expandedChat = new Set();
  let expandedSubtasks = new Set();
  let expandedPublishPicker = new Set();
  let openReactionPicker = null; // "chat:<id>" of "task:<id>" — welk reactie-plusje open staat
  let editingChatId = null; // klas-chat: id van bericht dat in bewerkmodus staat
  let editingTaskChatId = null; // taak-chat: id van bericht dat in bewerkmodus staat
  let searchQuery = "";
  let mobileDayIndex = null; // "Mijn planning": welke dag getoond wordt op een telefoonscherm
  let focusMode = false; // "Mijn planning": alleen vandaag groot tonen, ook op desktop
  try{ focusMode = localStorage.getItem("planning-focus") === "1"; }catch(e){}
  let todayOverviewOpen = true;

  // algemene planning UI state
  let genWeekOffset = 0;
  let genMobileDayIndex = null;
  let genFilterSubjectId = null;
  let genFilterUid = null;
  let genSelectedDept = undefined; // undefined = nog niet geïnitialiseerd; "__all__" | "__none__" | department-id

  // admin "planning maken" UI state
  let adminPlanUid = null;
  let adminPlanWeekOffset = 0;
  let adminOpenForm = null;
  let adminEditingId = null;
  let adminMobileDayIndex = null;

  /* ============ helpers ============ */
  function pad(n){ return n < 10 ? "0"+n : ""+n; }
  function toISO(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function todayISO(){ return toISO(new Date()); }
  function newId(){ return "t"+Date.now()+Math.random().toString(36).slice(2,7); }
  function escapeHtml(str){ const div = document.createElement("div"); div.textContent = str == null ? "" : str; return div.innerHTML; }
  function toggleSet(set, id){ if(set.has(id)) set.delete(id); else set.add(id); }

  /* ============ .ics agenda-export ============ */
  function icsEscape(str){ return String(str||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n"); }
  function icsDateStamp(){
    const d = new Date();
    return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+"T"+pad(d.getUTCHours())+pad(d.getUTCMinutes())+pad(d.getUTCSeconds())+"Z";
  }
  function buildICS(items){
    const lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Planning//NL","CALSCALE:GREGORIAN"];
    const stamp = icsDateStamp();
    items.forEach(t => {
      if(!t.date) return;
      lines.push("BEGIN:VEVENT");
      lines.push("UID:" + (t.id || newId()) + "@planning-app");
      lines.push("DTSTAMP:" + stamp);
      const dISO = t.date.replace(/-/g,"");
      if(t.type === "gepland" && t.startTime){
        const [sh, sm] = t.startTime.split(":");
        lines.push("DTSTART:" + dISO + "T" + sh.padStart(2,"0") + sm.padStart(2,"0") + "00");
        let eh = String((parseInt(sh,10)+1)%24).padStart(2,"0"), em = sm.padStart(2,"0");
        if(t.endTime){ const parts = t.endTime.split(":"); eh = parts[0].padStart(2,"0"); em = parts[1].padStart(2,"0"); }
        lines.push("DTEND:" + dISO + "T" + eh + em + "00");
      } else {
        lines.push("DTSTART;VALUE=DATE:" + dISO);
        const d = new Date(t.date); d.setDate(d.getDate()+1);
        lines.push("DTEND;VALUE=DATE:" + toISO(d).replace(/-/g,""));
      }
      lines.push("SUMMARY:" + icsEscape(t.title));
      const descParts = [];
      const subj = getSubject(t.subjectId);
      if(subj) descParts.push(subj.name);
      if(t.notes) descParts.push(t.notes);
      if(descParts.length) lines.push("DESCRIPTION:" + icsEscape(descParts.join(" — ")));
      if(t.location) lines.push("LOCATION:" + icsEscape(t.location));
      lines.push("END:VEVENT");
    });
    lines.push("END:VCALENDAR");
    return lines.join("\r\n");
  }
  function downloadICS(items, filename){
    const content = buildICS(items);
    const blob = new Blob([content], { type: "text/calendar;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
  }
  function isMobileView(){ return window.matchMedia("(max-width: 640px)").matches; }
  function buildDayTabs(dates, currentIndex, onSelect){
    const wrap = document.createElement("div");
    wrap.className = "day-tabs";
    dates.forEach((date, i) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "day-tab" + (i === currentIndex ? " active" : "") + (toISO(date) === todayISO() ? " is-today" : "");
      btn.innerHTML = `<span class="dt-name">${DAY_NAMES[i].slice(0,2)}</span><span class="dt-num">${date.getDate()}</span>`;
      btn.addEventListener("click", () => onSelect(i));
      wrap.appendChild(btn);
    });
    return wrap;
  }

  function getMonday(offset){
    const now = new Date();
    const day = now.getDay();
    const diffToMonday = (day === 0 ? -6 : 1) - day;
    const monday = new Date(now);
    monday.setHours(0,0,0,0);
    monday.setDate(now.getDate() + diffToMonday + offset*7);
    return monday;
  }
  function weekDates(offset){
    const monday = getMonday(offset);
    const dates = [];
    for(let i=0;i<7;i++){ const d = new Date(monday); d.setDate(monday.getDate()+i); dates.push(d); }
    return dates;
  }
  function fmtRange(dates){
    const start = dates[0], end = dates[6];
    const sameMonth = start.getMonth() === end.getMonth();
    const sameYear = start.getFullYear() === end.getFullYear();
    const startStr = start.getDate() + (sameMonth ? "" : " " + MONTHS[start.getMonth()]);
    const endStr = end.getDate() + " " + MONTHS[end.getMonth()] + (sameYear ? "" : " " + end.getFullYear());
    return startStr + " – " + endStr + " " + end.getFullYear();
  }
  function prioLabel(p){ return p === "hoog" ? "Hoog" : p === "laag" ? "Laag" : "Gemiddeld"; }
  function calcDuration(items){
    let mins = 0;
    items.forEach(t => {
      if(t.startTime && t.endTime){
        const [sh, sm] = t.startTime.split(":").map(Number);
        const [eh, em] = t.endTime.split(":").map(Number);
        const diff = (eh*60+em) - (sh*60+sm);
        if(diff > 0) mins += diff;
      }
    });
    return mins;
  }
  function fmtDuration(mins){
    if(mins <= 0) return null;
    const h = Math.floor(mins/60), m = mins % 60;
    return (h ? h+"u " : "") + (m ? m+"m" : (h ? "" : "0m"));
  }
  function getSubject(id){ return state.subjects.find(s => s.id === id) || state.subjects[0]; }
  function currentAccount(){ return state.accounts.find(a => a.uid === currentUser); }
  function isAdmin(){ const a = currentAccount(); return a && a.role === "admin"; }
  function ensureUserData(uid){ if(!state.usersData[uid]) state.usersData[uid] = { tasks: [] }; }
  function currentTasks(){ ensureUserData(currentUser); return state.usersData[currentUser].tasks; }
  function findAccountByUid(uid){ return state.accounts.find(a => a.uid === uid); }
  function accountByUid(uid){ return state.accounts.find(a => a.uid === uid); }
  function accountColor(uid){ const a = accountByUid(uid); return a ? a.color : "#8A8A8A"; }
  // Weergavenaam: gebruikt de zelfgekozen profielnaam als die er is, anders de inlognaam.
  function accountUsername(uid){ const a = accountByUid(uid); return a ? (a.displayName || a.username) : "?"; }
  // Avatar-label: emoji als de gebruiker die koos, anders de eerste letter van de weergavenaam.
  function accountInitial(uid){ const a = accountByUid(uid); if(!a) return "?"; if(a.avatarEmoji) return a.avatarEmoji; return (a.displayName || a.username).slice(0,1).toUpperCase(); }
  function otherApprovedAccounts(excludeUid){ return state.accounts.filter(a => a.status === "approved" && a.uid !== excludeUid); }
  function isSharedTask(t){ return Array.isArray(t.participants); }
  function isDoneForMe(t){ return isSharedTask(t) ? !!(t.doneByUid && t.doneByUid[currentUser]) : !!t.done; }
  function myPendingNotifications(){ return state.notifications.filter(n => n.toUid === currentUser); }
  function departmentName(id){ if(!id) return "Geen afdeling"; const d = state.departments.find(x => x.id === id); return d ? d.name : "Onbekende afdeling"; }
  // Elk account kan bij meerdere afdelingen horen. accountDepartmentIds normaliseert ook oudere
  // accounts die nog het vroegere enkelvoudige `department`-veld hebben.
  function accountDepartmentIds(acc){
    if(!acc) return [];
    if(Array.isArray(acc.departments)) return acc.departments;
    if(acc.department) return [acc.department];
    return [];
  }
  function myDepartmentIds(){ return accountDepartmentIds(currentAccount()); }
  function myDepartmentId(){ const ids = myDepartmentIds(); return ids.length ? ids[0] : null; }
  function departmentNamesList(acc){
    const ids = accountDepartmentIds(acc);
    if(ids.length === 0) return "Geen afdeling";
    return ids.map(departmentName).join(", ");
  }
  const AVATAR_EMOJI_OPTIONS = ["😀","🐱","🐶","🦊","🐼","🚀","⭐","🎯","📚","🎨","🔥","🌟","🍀","🎵","⚡","🌈"];
  const REACTION_EMOJI_OPTIONS = ["👍","❤️","😂","😮","👏","🎉"];
  const ACCENT_THEMES = {
    groen:     { accent: "#2F5233", accentSoft: "#DCE6DA", dark: { accent: "#7FB98C", accentSoft: "#2E3B2E" } },
    blauw:     { accent: "#2E5A8C", accentSoft: "#DCE6F0", dark: { accent: "#7FA8DE", accentSoft: "#243247" } },
    paars:     { accent: "#6B3F8C", accentSoft: "#E7DCF0", dark: { accent: "#C08FE0", accentSoft: "#372B47" } },
    terracotta:{ accent: "#B0512E", accentSoft: "#F1DBCF", dark: { accent: "#E39373", accentSoft: "#4A2E24" } },
    goud:      { accent: "#9C7A1E", accentSoft: "#F0E7C8", dark: { accent: "#E0BE5C", accentSoft: "#473C1E" } }
  };

  // Herkent @gebruikersnaam of @weergavenaam in tekst. Geeft de tekst terug als veilige HTML
  // met vermeldingen gemarkeerd, en de lijst met geraakte accounts (voor meldingen).
  function parseMentions(text){
    const found = [];
    const seen = new Set();
    state.accounts.forEach(a => {
      const names = [a.username, a.displayName].filter(Boolean);
      names.forEach(name => {
        const re = new RegExp("@" + name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b", "i");
        if(re.test(text) && !seen.has(a.uid)){ seen.add(a.uid); found.push(a); }
      });
    });
    return found;
  }
  function renderMessageHtml(text){
    let html = escapeHtml(text);
    state.accounts.forEach(a => {
      const names = [a.username, a.displayName].filter(Boolean);
      names.forEach(name => {
        const re = new RegExp("@" + escapeHtml(name).replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b", "gi");
        html = html.replace(re, m => `<span style="color:var(--accent); font-weight:600;">${m}</span>`);
      });
    });
    return html;
  }
  function sendMentionNotifications(text, contextLabel){
    parseMentions(text).forEach(a => {
      if(a.uid === currentUser) return;
      state.notifications.push({
        id: newId(), type: "mention", toUid: a.uid, fromUid: currentUser,
        fromUsername: accountUsername(currentUser), text: text, contextLabel: contextLabel,
        at: new Date().toISOString(), status: "pending"
      });
    });
  }
  function buildReactionBar(msg, contextKey, onChange){
    const row = document.createElement("div");
    row.className = "reaction-row";
    msg.reactions = msg.reactions || {};
    Object.keys(msg.reactions).forEach(emoji => {
      const uids = msg.reactions[emoji] || [];
      if(uids.length === 0) return;
      const pill = document.createElement("button");
      pill.type = "button";
      pill.className = "reaction-pill" + (uids.includes(currentUser) ? " mine" : "");
      pill.textContent = emoji + " " + uids.length;
      pill.title = uids.map(accountUsername).join(", ");
      pill.addEventListener("click", () => {
        const idx = uids.indexOf(currentUser);
        if(idx >= 0) uids.splice(idx, 1); else uids.push(currentUser);
        onChange();
      });
      row.appendChild(pill);
    });
    const addBtn = document.createElement("button");
    addBtn.type = "button"; addBtn.className = "reaction-add-btn"; addBtn.textContent = "+";
    addBtn.title = "Reageer";
    addBtn.addEventListener("click", () => {
      openReactionPicker = openReactionPicker === contextKey ? null : contextKey;
      onChange();
    });
    row.appendChild(addBtn);
    if(openReactionPicker === contextKey){
      const picker = document.createElement("span");
      picker.className = "reaction-picker";
      REACTION_EMOJI_OPTIONS.forEach(emoji => {
        const b = document.createElement("button");
        b.type = "button"; b.textContent = emoji;
        b.addEventListener("click", () => {
          msg.reactions[emoji] = msg.reactions[emoji] || [];
          const idx = msg.reactions[emoji].indexOf(currentUser);
          if(idx >= 0) msg.reactions[emoji].splice(idx, 1); else msg.reactions[emoji].push(currentUser);
          openReactionPicker = null;
          onChange();
        });
        picker.appendChild(b);
      });
      row.appendChild(picker);
    }
    return row;
  }

  /* ============ persistence (Firestore, realtime, gedeeld tussen apparaten) ============ */
  function mergeDefaultSubjects(){
    const names = new Set(state.subjects.map(s => s.name.toLowerCase()));
    DEFAULT_SUBJECTS.forEach(def => {
      if(!names.has(def.name.toLowerCase())) state.subjects.push({ ...def, id: def.id + "-m" + Math.random().toString(36).slice(2,5) });
    });
  }
  function normalizeAllTasks(){
    Object.values(state.usersData).forEach(u => {
      (u.tasks || []).forEach(t => {
        if(t.type !== "gepland") t.type = "taak";
        if(!t.priority) t.priority = "gemiddeld";
        if(typeof t.notes !== "string") t.notes = "";
        if(typeof t.lockedByAdmin !== "boolean") t.lockedByAdmin = false;
        if(typeof t.published !== "boolean") t.published = false;
        if(!Array.isArray(t.subtasks)) t.subtasks = [];
      });
    });
  }
  function normalizeSharedTasks(){
    state.sharedTasks.forEach(t => {
      if(t.type !== "gepland") t.type = "taak";
      if(!t.priority) t.priority = "gemiddeld";
      if(typeof t.notes !== "string") t.notes = "";
      if(!Array.isArray(t.participants)) t.participants = t.ownerUid ? [t.ownerUid] : [];
      if(!Array.isArray(t.pendingInvites)) t.pendingInvites = [];
      if(!Array.isArray(t.chat)) t.chat = [];
      if(typeof t.published !== "boolean") t.published = false;
      if(!Array.isArray(t.subtasks)) t.subtasks = [];
      if(!t.doneByUid || typeof t.doneByUid !== "object") t.doneByUid = {};
      t.lockedByAdmin = false;
    });
  }
  function normalizeAccounts(){
    state.accounts.forEach(a => {
      if(!Array.isArray(a.departments)){
        a.departments = a.department ? [a.department] : [];
      }
      delete a.department;
      if(typeof a.shareOwnTasksWithAdmin !== "boolean") a.shareOwnTasksWithAdmin = false;
      if(!a.themeColor) a.themeColor = "groen";
    });
  }
  function logActivity(text){
    state.activityLog.unshift({ id: newId(), at: new Date().toISOString(), actorUsername: accountUsername(currentUser), text });
    if(state.activityLog.length > 200) state.activityLog.length = 200;
  }

  const STATE_DOC = () => db.collection("appState").doc("main");
  let unsubscribeSnapshot = null;

  function subscribeState(onFirstLoad){
    let firstLoadDone = false;
    if(unsubscribeSnapshot) unsubscribeSnapshot();
    unsubscribeSnapshot = STATE_DOC().onSnapshot(docSnap => {
      if(docSnap.exists){
        const data = docSnap.data();
        state.accounts = Array.isArray(data.accounts) ? data.accounts : [];
        state.usersData = data.usersData && typeof data.usersData === "object" ? data.usersData : {};
        state.subjects = Array.isArray(data.subjects) && data.subjects.length ? data.subjects : DEFAULT_SUBJECTS.slice();
        state.published = Array.isArray(data.published) ? data.published : [];
        state.chat = Array.isArray(data.chat) ? data.chat : [];
        state.sharedTasks = Array.isArray(data.sharedTasks) ? data.sharedTasks : [];
        state.notifications = Array.isArray(data.notifications) ? data.notifications : [];
        state.departments = Array.isArray(data.departments) ? data.departments : [];
        state.activityLog = Array.isArray(data.activityLog) ? data.activityLog : [];
        mergeDefaultSubjects();
        normalizeAllTasks();
        normalizeSharedTasks();
        normalizeAccounts();
      }
      firestoreReady = true;
      if(!firstLoadDone){ firstLoadDone = true; if(onFirstLoad) onFirstLoad(); return; }
      // Dit is de lokale echo van onze eigen zojuist verstuurde wijziging (nog niet
      // door de server bevestigd). Onze lokale `state` bevat deze wijziging al,
      // dus opnieuw renderen is onnodig — en zorgt juist voor het vervelende
      // "herladen tijdens typen" doordat invoervelden opnieuw worden opgebouwd.
      if(docSnap.metadata.hasPendingWrites) return;
      {
        // als het account van de ingelogde gebruiker tussentijds is verwijderd/geblokkeerd, direct uitloggen
        if(currentUser){
          const acc = findAccountByUid(currentUser);
          if(!acc || acc.status === "pending"){
            currentUser = null;
            if(unsubscribeSnapshot){ unsubscribeSnapshot(); unsubscribeSnapshot = null; }
            auth.signOut();
            authMode = "login"; authSuccess = "";
            authError = !acc ? "Je account bestaat niet meer." : "Dit account wacht nog op goedkeuring van de beheerder.";
            renderAuth();
            return;
          }
        }
        renderRoot();
      }
    }, err => {
      console.error("Firestore verbinding mislukt", err);
      showToast("Kon geen verbinding maken met de database. Controleer firebaseConfig.");
    });
  }

  let saveTimer = null;
  function saveApp(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      // JSON round-trip: verwijdert 'undefined' waarden die Firestore niet accepteert
      const clean = JSON.parse(JSON.stringify(state));
      STATE_DOC().set(clean).catch(err => {
        console.error("Opslaan mislukt", err);
        showToast("Opslaan is mislukt — controleer je internetverbinding.");
      });
    }, 150);
  }

  /* ============ toasts ============ */
  function firebaseErrorToDutch(err){
    const code = err && err.code;
    if(code === "auth/email-already-in-use") return "Deze gebruikersnaam bestaat al.";
    if(code === "auth/weak-password") return "Wachtwoord moet minstens 6 tekens zijn.";
    if(code === "auth/invalid-email") return "Ongeldige gebruikersnaam.";
    if(code === "auth/wrong-password" || code === "auth/user-not-found" || code === "auth/invalid-credential" || code === "auth/invalid-login-credentials") return "Onjuiste gebruikersnaam of wachtwoord.";
    if(code === "auth/too-many-requests") return "Te veel pogingen — probeer het over een paar minuten opnieuw.";
    if(code === "auth/network-request-failed") return "Geen internetverbinding.";
    return "Er ging iets mis" + (err && err.message ? ": " + err.message : ".");
  }
  function showToast(message, actionLabel, actionFn){
    const container = document.getElementById("toastContainer");
    const toast = document.createElement("div");
    toast.className = "toast";
    const msg = document.createElement("span");
    msg.textContent = message;
    toast.appendChild(msg);
    if(actionLabel && actionFn){
      const btn = document.createElement("button");
      btn.textContent = actionLabel;
      btn.addEventListener("click", () => { actionFn(); toast.remove(); });
      toast.appendChild(btn);
    }
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 6000);
  }

  /* ============ theme ============ */
  function applyTheme(theme){
    document.documentElement.setAttribute("data-theme", theme);
    const btn = document.getElementById("themeToggle");
    if(btn) btn.textContent = theme === "dark" ? "☀" : "🌙";
    applyAccentTheme();
  }
  function toggleTheme(){
    const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    applyTheme(next);
    try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
  }
  function applyAccentTheme(){
    const acc = currentAccount();
    const key = (acc && acc.themeColor && ACCENT_THEMES[acc.themeColor]) ? acc.themeColor : "groen";
    const theme = ACCENT_THEMES[key];
    const isDark = document.documentElement.getAttribute("data-theme") === "dark";
    const picked = isDark ? theme.dark : { accent: theme.accent, accentSoft: theme.accentSoft };
    document.documentElement.style.setProperty("--accent", picked.accent);
    document.documentElement.style.setProperty("--accent-soft", picked.accentSoft);
  }

  /* ============ root render ============ */
  function renderRoot(){
    if(!currentUser) renderAuth(); else renderApp();
  }

  /* ============ AUTH ============ */
  function renderAuth(){
    const app = document.getElementById("app");
    app.innerHTML = "";
    const wrap = document.createElement("div");
    wrap.className = "auth-wrap";
    const card = document.createElement("div");
    card.className = "auth-card";
    wrap.appendChild(card);
    app.appendChild(wrap);

    if(needsAdminSetup){
      renderAdminSetup(card);
    } else {
      renderLoginForm(card);
    }
  }

  function messageBlock(){
    let html = "";
    if(authError) html += `<div class="auth-error">${escapeHtml(authError)}</div>`;
    if(authSuccess) html += `<div class="auth-success">${escapeHtml(authSuccess)}</div>`;
    return html;
  }

  function renderAdminSetup(card){
    card.innerHTML = `
      <h1>Beheerder instellen</h1>
      <div class="sub">Eerste keer opstarten — maak het beheerdersaccount aan.</div>
      <div class="auth-note">Dit wachtwoord wordt alleen in jouw eigen browser opgeslagen (nooit in het bestand zelf). Kies een wachtwoord dat je nog nergens anders hebt gebruikt.</div>
      ${messageBlock()}
      <label>Gebruikersnaam</label>
      <input class="field-input" id="af-user" type="text" value="Jente">
      <label>Wachtwoord</label>
      <input class="field-input" id="af-pass" type="password">
      <label>Herhaal wachtwoord</label>
      <input class="field-input" id="af-pass2" type="password">
      <button class="auth-submit" id="af-submit">Beheerder aanmaken</button>
    `;
    card.querySelector("#af-submit").addEventListener("click", () => {
      const username = card.querySelector("#af-user").value.trim();
      const pass = card.querySelector("#af-pass").value;
      const pass2 = card.querySelector("#af-pass2").value;
      authError = ""; authSuccess = "";
      if(!username || !pass){ authError = "Vul gebruikersnaam en wachtwoord in."; renderAuth(); return; }
      if(pass.length < 6){ authError = "Wachtwoord moet minstens 6 tekens zijn."; renderAuth(); return; }
      if(pass !== pass2){ authError = "Wachtwoorden komen niet overeen."; renderAuth(); return; }
      const submitBtn = card.querySelector("#af-submit");
      submitBtn.disabled = true; submitBtn.textContent = "Even geduld…";
      auth.createUserWithEmailAndPassword(username.toLowerCase() + EMAIL_SUFFIX, pass)
        .then(cred => {
          const uid = cred.user.uid;
          state.accounts = [{ uid, username, role: "admin", status: "approved", color: ACCOUNT_PALETTE[0] }];
          state.usersData = { [uid]: { tasks: [] } };
          state.subjects = DEFAULT_SUBJECTS.slice();
          state.published = []; state.chat = []; state.sharedTasks = []; state.notifications = [];
          return Promise.all([
            db.collection("meta").doc("setup").set({ initialized: true }),
            STATE_DOC().set(JSON.parse(JSON.stringify(state)))
          ]);
        })
        .then(() => {
          needsAdminSetup = false;
          activeTab = "mine";
          // onAuthStateChanged pikt de ingelogde gebruiker op en rendert de app
        })
        .catch(err => {
          authError = firebaseErrorToDutch(err);
          submitBtn.disabled = false; submitBtn.textContent = "Beheerder aanmaken";
          renderAuth();
        });
    });
  }

  function renderLoginForm(card){
    card.innerHTML = `
      <h1>Inloggen</h1>
      <div class="sub">Log in op je planning.</div>
      ${messageBlock()}
      <label>Gebruikersnaam</label>
      <input class="field-input" id="lf-user" type="text">
      <label>Wachtwoord</label>
      <input class="field-input" id="lf-pass" type="password">
      <button class="auth-submit" id="lf-submit">Inloggen</button>
      <div class="auth-note">Nog geen account? Vraag de beheerder om er één voor je aan te maken (tabblad "Accounts").</div>
    `;
    const submit = () => {
      const username = card.querySelector("#lf-user").value.trim();
      const pass = card.querySelector("#lf-pass").value;
      authError = ""; authSuccess = "";
      if(!username || !pass){ authError = "Vul gebruikersnaam en wachtwoord in."; renderAuth(); return; }
      const submitBtn = card.querySelector("#lf-submit");
      submitBtn.disabled = true; submitBtn.textContent = "Even geduld…";
      auth.signInWithEmailAndPassword(username.toLowerCase() + EMAIL_SUFFIX, pass)
        .then(cred => {
          const uid = cred.user.uid;
          return STATE_DOC().get().then(snap => {
            const data = snap.exists ? snap.data() : {};
            const accounts = data.accounts || [];
            const acc = accounts.find(a => a.uid === uid);
            if(!acc || acc.status === "pending"){
              return auth.signOut().then(() => {
                authError = "Dit account wacht nog op goedkeuring van de beheerder.";
                submitBtn.disabled = false; submitBtn.textContent = "Inloggen";
                renderAuth();
              });
            }
            weekOffset = 0; activeTab = "mine";
            // onAuthStateChanged + subscribeState renderen de app verder
          });
        })
        .catch(err => {
          authError = firebaseErrorToDutch(err);
          submitBtn.disabled = false; submitBtn.textContent = "Inloggen";
          renderAuth();
        });
    };
    card.querySelector("#lf-submit").addEventListener("click", submit);
    card.querySelector("#lf-pass").addEventListener("keydown", e => { if(e.key === "Enter") submit(); });
  }

  /* ============ APP SHELL ============ */
  function renderApp(){
    const app = document.getElementById("app");
    app.innerHTML = "";

    const nav = document.createElement("div");
    nav.className = "nav";
    const acc = currentAccount();
    nav.innerHTML = `
      <div class="nav-brand">
        <h1>Planning</h1>
        <span class="who"><span class="account-color-dot" style="background:${acc ? acc.color : '#888'}"></span>${acc && acc.avatarEmoji ? acc.avatarEmoji + ' ' : ''}Ingelogd als <strong>${escapeHtml(acc ? (acc.displayName || acc.username) : "…")}</strong>${acc && acc.role === "admin" ? '<span class="role-badge">beheerder</span>' : ''}</span>
      </div>
      <div class="nav-tabs" id="navTabs"></div>
      <div class="nav-actions" id="navActions"></div>
    `;
    app.appendChild(nav);

    const tabs = [["mine","Mijn planning"],["general","Algemene planning"],["chat","Chat"],["profile","Profiel"]];
    if(acc && acc.role === "admin") tabs.push(["adminplan","Planning maken"],["accounts","Accounts"]);
    const tabBox = nav.querySelector("#navTabs");
    tabs.forEach(([key,label]) => {
      const btn = document.createElement("button");
      btn.className = "nav-tab" + (activeTab === key ? " active" : "");
      btn.textContent = label;
      btn.addEventListener("click", () => { activeTab = key; renderApp(); });
      tabBox.appendChild(btn);
    });

    const navActions = nav.querySelector("#navActions");
    const pendingNotifs = myPendingNotifications();
    navActions.innerHTML = `
      <details class="notif-wrap">
        <summary class="tool-btn bell-btn" title="Meldingen">🔔${pendingNotifs.length ? `<span class="notif-badge">${pendingNotifs.length}</span>` : ''}</summary>
        <div class="notif-panel" id="notifPanel"></div>
      </details>
      <button class="tool-btn theme-btn" id="themeToggle" title="Donker/licht">🌙</button>
      <button class="tool-btn" id="logoutBtn">Uitloggen</button>
    `;
    renderNotifPanel(navActions.querySelector("#notifPanel"));
    navActions.querySelector("#themeToggle").addEventListener("click", toggleTheme);
    navActions.querySelector("#logoutBtn").addEventListener("click", () => {
      auth.signOut();
      authMode = "login"; authError=""; authSuccess="";
    });

    const content = document.createElement("div");
    content.id = "tabContent";
    app.appendChild(content);

    let savedTheme = "light";
    try{ savedTheme = localStorage.getItem(THEME_KEY) || "light"; }catch(e){}
    applyTheme(savedTheme);

    if(activeTab === "mine") renderMineTab(content);
    else if(activeTab === "general") renderGeneralTab(content);
    else if(activeTab === "chat") renderChatTab(content);
    else if(activeTab === "profile") renderProfileTab(content);
    else if(activeTab === "adminplan" && acc && acc.role === "admin") renderAdminPlanningTab(content);
    else if(activeTab === "accounts" && acc && acc.role === "admin") renderAccountsTab(content);
    else { activeTab = "mine"; renderMineTab(content); }
  }

  /* ============ NOTIFICATIES ============ */
  function renderNotifPanel(container){
    const items = myPendingNotifications();
    if(items.length === 0){
      container.innerHTML = `<div class="empty-hint">Geen meldingen.</div>`;
      return;
    }
    container.innerHTML = "";
    items.forEach(n => {
      const row = document.createElement("div");
      row.className = "notif-item";

      if(n.type === "mention"){
        row.innerHTML = `<div><strong>${escapeHtml(n.fromUsername)}</strong> noemde je ${n.contextLabel ? "in " + escapeHtml(n.contextLabel) : "in de chat"}: <em>"${escapeHtml(n.text)}"</em></div>`;
        const actionsBox = document.createElement("div");
        actionsBox.className = "notif-actions";
        const okBtn = document.createElement("button");
        okBtn.className = "approve-btn"; okBtn.textContent = "Gezien";
        okBtn.addEventListener("click", () => {
          state.notifications = state.notifications.filter(x => x.id !== n.id);
          saveApp(); renderApp();
        });
        actionsBox.appendChild(okBtn);
        row.appendChild(actionsBox);
        container.appendChild(row);
        return;
      }

      row.innerHTML = `<div><strong>${escapeHtml(n.fromUsername)}</strong> heeft je uitgenodigd voor: <em>${escapeHtml(n.taskTitle)}</em></div>`;
      const actionsBox = document.createElement("div");
      actionsBox.className = "notif-actions";
      const acceptBtn = document.createElement("button");
      acceptBtn.className = "approve-btn"; acceptBtn.textContent = "Accepteren";
      acceptBtn.addEventListener("click", () => {
        const st = state.sharedTasks.find(t => t.id === n.taskId);
        if(st){
          st.pendingInvites = (st.pendingInvites || []).filter(u => u !== currentUser);
          if(!st.participants.includes(currentUser)) st.participants.push(currentUser);
        } else {
          showToast("Deze gedeelde taak bestaat niet meer.");
        }
        state.notifications = state.notifications.filter(x => x.id !== n.id);
        saveApp(); renderApp();
      });
      const declineBtn = document.createElement("button");
      declineBtn.className = "reject-btn"; declineBtn.textContent = "Afwijzen";
      declineBtn.addEventListener("click", () => {
        const st = state.sharedTasks.find(t => t.id === n.taskId);
        if(st) st.pendingInvites = (st.pendingInvites || []).filter(u => u !== currentUser);
        state.notifications = state.notifications.filter(x => x.id !== n.id);
        saveApp(); renderApp();
      });
      actionsBox.appendChild(acceptBtn); actionsBox.appendChild(declineBtn);
      row.appendChild(actionsBox);
      container.appendChild(row);
    });

  }

  /* ============ MIJN PLANNING TAB ============ */
  function insertTaskOrdered(task, dateISO, beforeTaskId){
    let tasks = currentTasks();
    state.usersData[currentUser].tasks = tasks.filter(t => t.id !== task.id);
    tasks = state.usersData[currentUser].tasks;
    task.date = dateISO;
    if(beforeTaskId){
      const idx = tasks.findIndex(t => t.id === beforeTaskId);
      tasks.splice(idx === -1 ? tasks.length : idx, 0, task);
    } else {
      const group = tasks.filter(t => t.date === dateISO);
      if(group.length){
        const lastId = group[group.length-1].id;
        const idx = tasks.findIndex(t => t.id === lastId);
        tasks.splice(idx+1, 0, task);
      } else { tasks.push(task); }
    }
  }
  function getTasksForDate(dateISO){
    const personal = currentTasks().filter(t => t.date === dateISO);
    const shared = state.sharedTasks.filter(t => t.date === dateISO && (t.ownerUid === currentUser || (t.participants||[]).includes(currentUser)));
    return personal.concat(shared);
  }

  function renderTodayBox(){
    const holder = document.getElementById("todayBox");
    if(!holder) return;
    const items = getTasksForDate(todayISO()).slice().sort((a,b) => {
      if(a.type === "gepland" && b.type !== "gepland") return -1;
      if(a.type !== "gepland" && b.type === "gepland") return 1;
      if(a.type === "gepland") return (a.startTime||"").localeCompare(b.startTime||"");
      return 0;
    });
    const doneCount = items.filter(isDoneForMe).length;
    holder.innerHTML = "";
    const box = document.createElement("div");
    box.className = "today-box";
    const head = document.createElement("div");
    head.className = "today-box-head";
    head.innerHTML = `<h3>📌 Vandaag — ${items.length ? doneCount + "/" + items.length + " klaar" : "niets gepland"}</h3><span class="icon-btn">${todayOverviewOpen ? "▾" : "▸"}</span>`;
    head.addEventListener("click", () => { todayOverviewOpen = !todayOverviewOpen; renderTodayBox(); });
    box.appendChild(head);
    if(todayOverviewOpen){
      const body = document.createElement("div");
      body.className = "today-box-body";
      if(items.length === 0){
        const hint = document.createElement("div");
        hint.className = "today-empty";
        hint.textContent = "Niets op de planning voor vandaag. Fijne dag!";
        body.appendChild(hint);
      } else {
        items.forEach(t => {
          const subject = getSubject(t.subjectId);
          const row = document.createElement("div");
          row.className = "today-mini-item" + (isDoneForMe(t) ? " done" : "");
          row.style.setProperty("--subject-color", subject.color);
          const cb = document.createElement("input");
          cb.type = "checkbox"; cb.checked = isDoneForMe(t);
          cb.addEventListener("change", e => {
            if(isSharedTask(t)){
              t.doneByUid = t.doneByUid || {};
              t.doneByUid[currentUser] = e.target.checked;
              const allUids = Array.from(new Set([t.ownerUid, ...(t.participants||[])]));
              t.done = allUids.length > 0 && allUids.every(u => !!t.doneByUid[u]);
            } else {
              t.done = e.target.checked;
            }
            saveApp(); renderBoard();
          });
          row.appendChild(cb);
          if(t.type === "gepland"){
            const timeEl = document.createElement("span");
            timeEl.className = "tm-time";
            timeEl.textContent = t.startTime + (t.endTime ? "–" + t.endTime : "");
            row.appendChild(timeEl);
          }
          const titleEl = document.createElement("span");
          titleEl.textContent = t.title + (isSharedTask(t) ? " 👥" : "");
          titleEl.style.flex = "1";
          row.appendChild(titleEl);
          body.appendChild(row);
        });
      }
      box.appendChild(body);
    }
    holder.appendChild(box);
  }

      <footer>Jouw planning wordt automatisch bewaard. Gedeelde taken (👥) zijn ook zichtbaar voor de mensen die je uitnodigt.</footer>
    `;
    document.getElementById("prevWeek").addEventListener("click", () => { weekOffset--; renderBoard(); });
    document.getElementById("nextWeek").addEventListener("click", () => { weekOffset++; renderBoard(); });
    document.getElementById("todayBtn").addEventListener("click", () => { weekOffset = 0; mobileDayIndex = null; renderBoard(); });
    let searchDebounceTimer = null;
    document.getElementById("searchInput").addEventListener("input", e => {
      const val = e.target.value;
      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(() => { searchQuery = val.trim().toLowerCase(); renderBoard(); }, 300);
    });

    const focusBtn = document.getElementById("focusBtn");
    focusBtn.classList.toggle("active", focusMode);
    focusBtn.addEventListener("click", () => {
      focusMode = !focusMode;
      try{ localStorage.setItem("planning-focus", focusMode ? "1" : "0"); }catch(e){}
      renderBoard();
      document.getElementById("focusBtn").classList.toggle("active", focusMode);
    });

    document.getElementById("copyWeekBtn").addEventListener("click", () => {
      const dates = weekDates(weekOffset);
      const isoSet = new Set(dates.map(d => toISO(d)));
      const toCopy = currentTasks().filter(t => isoSet.has(t.date));
      if(toCopy.length === 0){ showToast("Deze week heeft nog geen taken om te kopiëren."); return; }
      if(!confirm("Alle " + toCopy.length + " taken van deze week kopiëren naar volgende week?")) return;
      toCopy.forEach(t => {
        const copy = { ...t, id: newId(), done: false, repeatGroupId: null, published: false, subtasks: (t.subtasks||[]).map(s => ({ ...s, id: newId(), done: false })) };
        const d = new Date(t.date); d.setDate(d.getDate() + 7);
        copy.date = toISO(d);
        currentTasks().push(copy);
      });
      saveApp(); renderBoard();
      showToast(toCopy.length + " taken gekopieerd naar volgende week.");
    });

    document.getElementById("icsBtn").addEventListener("click", () => {
      const dates = weekDates(weekOffset);
      const items = dates.flatMap(d => getTasksForDate(toISO(d)));
      if(items.length === 0){ showToast("Niets om te exporteren deze week."); return; }
      downloadICS(items, "planning-" + (currentAccount() ? currentAccount().username : "week") + ".ics");
    });

    document.getElementById("exportBtn").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify({ tasks: currentTasks(), subjects: state.subjects }, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "planning-" + (currentAccount() ? currentAccount().username : "backup") + "-" + todayISO() + ".json"; a.click();
      URL.revokeObjectURL(url);
    });
    const importFile = document.getElementById("importFile");
    document.getElementById("importBtn").addEventListener("click", () => importFile.click());
    importFile.addEventListener("change", () => {
      const file = importFile.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try{
          const parsed = JSON.parse(reader.result);
          if(!parsed || !Array.isArray(parsed.tasks)) throw new Error("ongeldig");
          state.usersData[currentUser].tasks = parsed.tasks;
          if(Array.isArray(parsed.subjects) && parsed.subjects.length){ state.subjects = parsed.subjects; mergeDefaultSubjects(); }
          normalizeAllTasks();
          saveApp();
          renderBoard();
          showToast("Backup geïmporteerd.");
        }catch(e){ showToast("Kon dit bestand niet lezen."); }
      };
      reader.readAsText(file);
      importFile.value = "";
    });

    renderBoard();
  }

  function renderBoard(){
    if(!document.getElementById("board")) return;
    const dates = weekDates(weekOffset);
    document.getElementById("weekRange").textContent = fmtRange(dates);

    const allTasksThisWeek = getTasksForDate ? dates.flatMap(d => getTasksForDate(toISO(d))) : [];
    const total = allTasksThisWeek.length;
    const done = allTasksThisWeek.filter(t => t.done).length;
    const pct = total ? Math.round((done/total)*100) : 0;
    document.getElementById("weekStats").innerHTML =
      "<strong>"+done+"</strong> / "+total+" afgerond deze week" +
      `<span class="week-progress-track"><span class="week-progress-fill" style="width:${pct}%"></span></span>`;

    renderFilters();
    renderTodayBox();

    const mobile = isMobileView() || focusMode;
    const dayTabsHolder = document.getElementById("mineDayTabs");
    if(mobile){
      if(mobileDayIndex === null){
        const idx = dates.findIndex(d => toISO(d) === todayISO());
        mobileDayIndex = idx >= 0 ? idx : 0;
      }
      dayTabsHolder.innerHTML = "";
      dayTabsHolder.appendChild(buildDayTabs(dates, mobileDayIndex, i => { mobileDayIndex = i; renderBoard(); }));
    } else {
      dayTabsHolder.innerHTML = "";
    }

    const board = document.getElementById("board");
    board.innerHTML = "";

    const dayIndices = mobile ? [mobileDayIndex] : [0,1,2,3,4,5,6];
    dayIndices.forEach(i => {
      const date = dates[i];
      const dateISO = toISO(date);
      const isToday = dateISO === todayISO();
      let dayTasks = getTasksForDate(dateISO);
      if(filterSubjectId) dayTasks = dayTasks.filter(t => t.subjectId === filterSubjectId);
      if(searchQuery) dayTasks = dayTasks.filter(t => t.title.toLowerCase().includes(searchQuery));
      const timeItems = dayTasks.filter(t => t.type === "gepland").slice().sort((a,b) => (a.startTime||"").localeCompare(b.startTime||""));
      const taskItems = dayTasks.filter(t => t.type !== "gepland");
      const doneCount = dayTasks.filter(t => t.done).length;
      const allDone = dayTasks.length > 0 && doneCount === dayTasks.length;
      const dayPct = dayTasks.length ? Math.round((doneCount/dayTasks.length)*100) : 0;
      const durationLabel = fmtDuration(calcDuration(timeItems));

      const col = document.createElement("div");
      col.className = "column";
      col.dataset.date = dateISO;

      const head = document.createElement("div");
      head.className = "column-head" + (isToday ? " is-today" : "");
      head.innerHTML = `
        <div class="day-name">${DAY_NAMES[i]}</div>
        <div class="day-date">${date.getDate()} ${MONTHS[date.getMonth()]}</div>
        <div class="day-progress-row">
          <div class="day-progress${allDone ? ' celebrate' : ''}">${dayTasks.length ? (allDone ? "🎉 Alles klaar!" : doneCount + " / " + dayTasks.length + " klaar") : "Nog niks gepland"}</div>
          ${doneCount ? '<button class="clear-done">wis afgeronde</button>' : ''}
        </div>
        ${dayTasks.length ? `<div class="progress-track"><div class="progress-fill" style="width:${dayPct}%"></div></div>` : ''}
      `;
      if(doneCount){
        head.querySelector(".clear-done").addEventListener("click", () => {
          const removed = currentTasks().filter(t => t.date === dateISO && t.done);
          state.usersData[currentUser].tasks = currentTasks().filter(t => !(t.date === dateISO && t.done));
          saveApp(); renderBoard();
          showToast(removed.length + " afgeronde taken gewist", "Ongedaan maken", () => {
            state.usersData[currentUser].tasks.push(...removed);
            saveApp(); renderBoard();
          });
        });
      }
      col.appendChild(head);

      col.appendChild(buildSectionLabel("Vaste tijden", durationLabel));
      col.appendChild(buildDropList(dateISO, "gepland", timeItems, "Geen vaste afspraken"));

      const divider = document.createElement("div");
      divider.className = "section-divider";
      col.appendChild(divider);

      col.appendChild(buildSectionLabel("Taken"));
      col.appendChild(buildDropList(dateISO, "taak", taskItems, "Nog geen taken"));

      const addWrap = document.createElement("div");
      addWrap.className = "add-task-wrap";
      if(openForm === dateISO){
        addWrap.appendChild(buildAddForm(dateISO));
      } else {
        const btn = document.createElement("button");
        btn.className = "add-btn";
        btn.textContent = "+ toevoegen";
        btn.addEventListener("click", () => { openForm = dateISO; renderBoard(); });
        addWrap.appendChild(btn);
      }
      col.appendChild(addWrap);

      board.appendChild(col);
    });
  }

  function buildSectionLabel(text, suffix){
    const el = document.createElement("div");

  function buildDropList(dateISO, type, items, emptyText){
    const list = document.createElement("div");
    list.className = "list";
    list.dataset.date = dateISO;
    list.dataset.type = type;

    list.addEventListener("dragover", e => { if(draggingType !== type) return; e.preventDefault(); list.classList.add("drag-over"); });
    list.addEventListener("dragleave", () => list.classList.remove("drag-over"));
    list.addEventListener("drop", e => {
      if(draggingType !== type) return;
      e.preventDefault();
      list.classList.remove("drag-over");
      const id = e.dataTransfer.getData("text/plain");
      const task = currentTasks().find(t => t.id === id);
      if(!task || task.lockedByAdmin) return;
      const cards = Array.from(list.querySelectorAll(".task-card")).filter(c => c.dataset.id !== id);
      let beforeId = null;
      for(const c of cards){
        const rect = c.getBoundingClientRect();
        if(e.clientY < rect.top + rect.height/2){ beforeId = c.dataset.id; break; }
      }
      insertTaskOrdered(task, dateISO, beforeId);
      saveApp(); renderBoard();
    });

    if(items.length === 0){
      const hint = document.createElement("div");
      hint.className = "empty-hint";
      hint.textContent = emptyText;
      list.appendChild(hint);
    }
    items.forEach(task => {
      if(task.id === editingId && !task.lockedByAdmin) list.appendChild(buildAddForm(dateISO, task));
      else list.appendChild(buildCard(task));
    });
    return list;
  }
